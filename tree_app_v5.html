<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Дерево задач v6</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0d0f1a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Дерево задач">
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dagre/0.8.5/dagre.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@700&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0d0f1a;--surf:#151829;--surf2:#1d2035;--border:#252840;
  --acc:#6c63ff;--red:#ff6584;--grn:#43e97b;--yel:#f9ca24;
  --txt:#e8eaf0;--txt2:#8890a4;
}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--txt);overflow:hidden;height:100vh;width:100vw}

/* ─── TOOLBAR ─── */
#toolbar{
  position:fixed;top:0;left:0;right:0;height:50px;
  background:var(--surf);border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:5px;padding:0 10px;
  z-index:1000;overflow-x:auto;overflow-y:hidden;
  -webkit-overflow-scrolling:touch;scrollbar-width:none;
}
#toolbar::-webkit-scrollbar{display:none}
.logo{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:14px;color:var(--acc);flex-shrink:0;margin-right:6px}
.tb{display:flex;align-items:center;gap:4px;padding:6px 10px;border:1px solid var(--border);border-radius:7px;background:var(--surf2);color:var(--txt2);font-size:11px;font-weight:700;cursor:pointer;white-space:nowrap;flex-shrink:0;font-family:inherit;transition:all .15s}
.tb:hover{border-color:var(--acc);color:var(--acc)}
.tb.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.tb.ron.on{background:var(--red);border-color:var(--red)}
.tb.grn{border-color:var(--grn);color:var(--grn);background:#0d200d}
.tb.grn:hover{background:var(--grn);color:#000}
#mode-badge{flex-shrink:0;margin-left:auto;padding:4px 9px;border-radius:20px;font-size:10px;font-weight:700;background:var(--border);color:var(--txt2);letter-spacing:.5px;text-transform:uppercase;white-space:nowrap}
#mode-badge.c{background:#0d2a1a;color:var(--grn)}
#mode-badge.d{background:#2a0d14;color:var(--red)}

/* ─── CANVAS ─── */
#cw{
  position:fixed;top:50px;left:0;right:0;bottom:64px;
  overflow:hidden;touch-action:none;
  background:var(--bg);
  background-image:radial-gradient(circle,#252840 1px,transparent 1px);
  background-size:26px 26px;
}
#cv{position:absolute;width:9000px;height:9000px;transform-origin:0 0}
#svg{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;overflow:visible}

/* ─── NODE ─── */
.node{
  position:absolute;min-width:150px;max-width:230px;
  background:var(--surf);border:1.5px solid var(--border);
  border-radius:11px;padding:11px 11px 9px;
  user-select:none;z-index:10;
  box-shadow:0 4px 20px rgba(0,0,0,.5);transition:border-color .15s,box-shadow .15s;
}
.node:hover{border-color:var(--acc);box-shadow:0 4px 20px rgba(108,99,255,.2)}
.node.cs{border-color:var(--grn);box-shadow:0 4px 20px rgba(67,233,123,.3)}
.node.drag{border-color:var(--yel);box-shadow:0 8px 30px rgba(249,202,36,.3);z-index:200;cursor:grabbing}
.node.lp-ready{border-color:var(--yel)}/* long-press feedback */

.ntop{display:flex;align-items:flex-start;gap:7px;margin-bottom:7px}
.badge{flex-shrink:0;width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,var(--acc),#a78bfa);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;font-family:'JetBrains Mono',monospace}
.badge.t{background:linear-gradient(135deg,var(--yel),#f0932b)}
.ntxt{flex:1;font-size:13px;line-height:1.5;color:var(--txt);word-break:break-word;min-height:18px;border-radius:4px;padding:1px 3px;outline:none}
.ntxt:focus{background:rgba(108,99,255,.1);outline:2px solid var(--acc)}
.nacts{display:flex;gap:3px;flex-shrink:0}
.nibtn{width:21px;height:21px;border:none;border-radius:5px;cursor:pointer;font-size:11px;display:flex;align-items:center;justify-content:center;background:var(--border);color:var(--txt2);transition:all .15s}
.nibtn:hover{background:var(--red);color:#fff}
.nibtn.e:hover{background:var(--acc)}

.nbody{display:flex;flex-direction:column;gap:4px}
.cbrow{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--txt2)}
.cbrow input[type=checkbox]{width:15px;height:15px;accent-color:var(--acc);cursor:pointer;flex-shrink:0}
.cblabel{flex:1;min-width:0;cursor:pointer;border-radius:3px;padding:1px 2px}
.cblabel:hover{background:rgba(108,99,255,.1)}
.cblabel:focus{outline:2px solid var(--acc);background:rgba(108,99,255,.1)}
.minicbtn{align-self:flex-start;font-size:11px;padding:3px 8px;border-radius:5px;cursor:pointer;font-family:inherit;font-weight:600;border:1px solid var(--border);background:var(--surf2);color:var(--txt2);transition:all .15s}
.minicbtn:hover{border-color:var(--acc);color:var(--acc)}
.opentbl{border-color:var(--yel);color:var(--yel)}
.opentbl:hover{background:var(--yel);color:#000}

/* ─── MODAL ─── */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;align-items:center;justify-content:center;z-index:3000;backdrop-filter:blur(4px)}
.modal{background:var(--surf);border:1px solid var(--border);border-radius:14px;padding:24px;width:min(480px,96vw);max-height:92vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.modal h2{font-size:17px;margin-bottom:16px}.modal h2 span{color:var(--acc)}
.f{margin-bottom:12px}
.f label{display:block;font-size:11px;color:var(--txt2);margin-bottom:4px;font-weight:700;letter-spacing:.3px}
.f input,.f select,.f textarea{width:100%;padding:8px 11px;background:var(--bg);border:1px solid var(--border);border-radius:7px;color:var(--txt);font-size:13px;font-family:inherit;outline:none;transition:border-color .15s}
.f input:focus,.f select:focus{border-color:var(--acc)}
.f select option{background:var(--surf)}
.brow{display:flex;gap:7px;justify-content:flex-end;margin-top:6px}
.mbtn{padding:8px 16px;border:none;border-radius:7px;cursor:pointer;font-size:13px;font-weight:700;font-family:inherit;transition:all .15s}
.mbtn.cancel{background:var(--border);color:var(--txt2)}.mbtn.cancel:hover{background:var(--surf2)}
.mbtn.ok{background:var(--acc);color:#fff}.mbtn.ok:hover{background:#7c73ff}
.mbtn.danger{background:transparent;color:var(--red);border:1px solid var(--red)}.mbtn.danger:hover{background:var(--red);color:#fff}
.mbtn:disabled{opacity:.5;cursor:default}

/* ─── TABLE MODAL ─── */
.tscroll{overflow-x:auto;overflow-y:auto;max-height:360px;border:1px solid var(--border);border-radius:8px;margin-bottom:12px}
table{border-collapse:collapse;width:100%;font-size:12px}
th{background:var(--surf2);padding:8px 10px;border-bottom:1px solid var(--border);color:var(--txt2);font-weight:700;white-space:nowrap;position:sticky;top:0;z-index:2}
th.dth{text-align:left;min-width:130px}
td{padding:7px 10px;border-bottom:1px solid var(--border);text-align:center}
td.dtd{text-align:left;color:var(--txt2);font-size:11px;white-space:nowrap}
tr:last-child td{border-bottom:none}
tr.today td{background:rgba(108,99,255,.1)}tr.today td.dtd{color:var(--acc);font-weight:700}
td input[type=checkbox]{width:16px;height:16px;accent-color:var(--acc);cursor:pointer}
td input[type=checkbox]:disabled{cursor:not-allowed;opacity:.4}
/* v9 (часть 1): почасовая разметка внутри дня */
.hx{background:none;border:none;cursor:pointer;font-size:12px;padding:0 5px 0 0;opacity:.55;vertical-align:middle}
.hx:hover{opacity:1}
.hhint{font-size:11px;color:var(--txt2);line-height:1.5;margin:0 0 8px}
tr.hrow td{padding:8px;background:var(--surf2);text-align:left;white-space:normal}
.hpanel{position:sticky;left:0;box-sizing:border-box}
.hgrp+.hgrp{margin-top:9px}
.hgh{display:flex;justify-content:space-between;font-size:11px;color:var(--txt2);margin-bottom:4px}
.hgh b{color:var(--txt);font-family:'JetBrains Mono',monospace}
.hgrid{display:grid;grid-template-columns:repeat(12,1fr);gap:3px}
.hb{height:26px;padding:0;font-size:10px;font-family:'JetBrains Mono',monospace;background:var(--surf);border:1px solid var(--border);color:var(--txt2);border-radius:5px;cursor:pointer}
.hb:hover{border-color:var(--acc)}
.hb.on{background:var(--acc);border-color:var(--acc);color:#fff}
.hb.now{outline:1px solid var(--yel);outline-offset:1px}
.sbar{display:flex;align-items:center;gap:14px;background:var(--surf2);border:1px solid var(--border);border-radius:9px;padding:10px 14px;margin-bottom:14px}
.sv{font-family:'JetBrains Mono',monospace;font-size:22px;font-weight:700;color:var(--yel)}
.sl{font-size:11px;color:var(--txt2)}
.tv{margin-left:auto;font-size:12px;color:var(--txt2)}
.tv b{color:var(--acc);font-family:'JetBrains Mono',monospace;font-size:16px}
.atrow{display:flex;gap:7px;margin-top:8px}
.atrow input{flex:1;padding:7px 10px;background:var(--bg);border:1px solid var(--border);border-radius:6px;color:var(--txt);font-family:inherit;font-size:13px;outline:none}
.atrow input:focus{border-color:var(--acc)}
.atrow button{padding:7px 12px;background:var(--grn);color:#000;border:none;border-radius:6px;cursor:pointer;font-weight:700;font-size:13px;white-space:nowrap}

/* ─── ACHIEVEMENTS ─── */
.alist{display:flex;flex-direction:column;gap:7px}
.ai{display:flex;align-items:center;gap:11px;background:var(--surf2);border:1px solid var(--border);border-radius:9px;padding:11px 13px;transition:all .2s}
.ai.earned{border-color:var(--yel);background:rgba(249,202,36,.06)}
.ai.locked{opacity:.4;filter:grayscale(.7)}
.aico{font-size:24px;flex-shrink:0}
.ainfo{flex:1}.ainfo b{font-size:13px;display:block;margin-bottom:2px}.ainfo small{font-size:11px;color:var(--txt2)}
.adel{width:22px;height:22px;border:none;border-radius:5px;background:var(--border);color:var(--txt2);cursor:pointer;font-size:12px;flex-shrink:0}
.adel:hover{background:var(--red);color:#fff}

/* ─── STATUS ─── */
#status{position:fixed;bottom:0;left:0;right:0;height:26px;background:var(--surf);border-top:1px solid var(--border);display:flex;align-items:center;padding:0 12px;font-size:10px;color:var(--txt2);gap:14px;z-index:1000;font-family:'JetBrains Mono',monospace;overflow:hidden}
#status span b{color:var(--acc)}
#appver{color:var(--txt2);opacity:.75;white-space:nowrap;margin-left:auto}#appver.warn{color:var(--yel);opacity:1}
#sstatus{margin-left:14px;color:var(--grn);white-space:nowrap}

/* ─── LONG PRESS HINT ─── */
#lphint{position:fixed;bottom:34px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.8);color:var(--yel);padding:6px 14px;border-radius:20px;font-size:12px;pointer-events:none;opacity:0;transition:opacity .3s;z-index:5000}

/* ─── DRAG RING (visual indicator for long press) ─── */
@keyframes ring{0%{transform:scale(.5);opacity:1}100%{transform:scale(1.5);opacity:0}}
.lp-ring{position:absolute;width:60px;height:60px;border:3px solid var(--yel);border-radius:50%;pointer-events:none;animation:ring .3s forwards;z-index:9999}

/* ─── INSTRUCTIONS ─── */
.isect{margin-bottom:12px}
.isect h3{color:var(--acc);font-size:12px;margin-bottom:5px}
.isect li{font-size:12px;color:var(--txt2);line-height:1.7;list-style:disc inside}
.kbd{background:var(--border);color:var(--txt);padding:1px 5px;border-radius:3px;font-family:'JetBrains Mono',monospace;font-size:11px}

/* ─── FIREBASE STATUS ─── */
#fb-status{flex-shrink:0;padding:3px 8px;border-radius:20px;font-size:10px;font-weight:700;background:var(--border);color:var(--txt2);letter-spacing:.3px;white-space:nowrap;cursor:default;font-family:'JetBrains Mono',monospace}
#fb-status.ok{background:#0a2a0a;color:#43e97b}
#fb-status.err{background:#2a0a0a;color:var(--red)}
#fb-status.sync{background:#1a1a0a;color:var(--yel)}

/* ─── AUTO-LAYOUT ANIMATION ─── */
.node.layout-move{transition:left .5s cubic-bezier(.4,0,.2,1),top .5s cubic-bezier(.4,0,.2,1),border-color .15s,box-shadow .15s}

/* ══════════════════════════════════════════════════
   LEAGUE / PROGRESS BAR (v5)
   ══════════════════════════════════════════════════ */
#leaguebar{
  position:fixed;left:0;right:0;bottom:26px;height:38px;
  background:var(--surf);border-top:1px solid var(--border);
  display:flex;align-items:center;gap:8px;padding:0 10px;
  z-index:999;font-family:'Inter',sans-serif;overflow:hidden;
}
#lg-icon{font-size:18px;flex-shrink:0}
#lg-name{font-size:11px;font-weight:700;color:var(--yel);flex-shrink:0;max-width:90px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#lg-track{flex:1;height:9px;border-radius:6px;background:var(--border);overflow:hidden;position:relative;min-width:40px}
#lg-fill{height:100%;border-radius:6px;background:linear-gradient(90deg,var(--acc),#a78bfa);transition:width .4s ease}
#lg-pts{font-size:10px;color:var(--txt2);flex-shrink:0;font-family:'JetBrains Mono',monospace;white-space:nowrap}
#lg-day{font-size:10px;color:var(--grn);flex-shrink:0;font-family:'JetBrains Mono',monospace;white-space:nowrap;cursor:pointer}
#lg-chest{flex-shrink:0;position:relative;cursor:pointer;font-size:18px;padding:2px 4px;border-radius:7px;background:var(--surf2);border:1px solid var(--border)}
#lg-chest.has{animation:chestpulse 1.4s infinite}
#lg-chest .badge-n{position:absolute;top:-6px;right:-6px;background:var(--red);color:#fff;font-size:9px;font-weight:700;border-radius:8px;padding:1px 4px;line-height:1.3;min-width:14px;text-align:center}
@keyframes chestpulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}

/* ─── LEVEL-UP OVERLAY ─── */
#levelup-ov{position:fixed;inset:0;background:rgba(0,0,0,.82);display:none;align-items:center;justify-content:center;z-index:6000;flex-direction:column;text-align:center}
#levelup-ov.show{display:flex}
#lu-icon{font-size:64px;animation:luIconPop .6s ease}
#lu-title{font-size:22px;font-weight:700;color:var(--yel);margin-top:10px;animation:luTextIn .5s ease .1s both}
#lu-sub{font-size:14px;color:var(--txt2);margin-top:6px;animation:luTextIn .5s ease .2s both}
#lu-close{margin-top:22px;padding:10px 26px;border:none;border-radius:8px;background:var(--acc);color:#fff;font-weight:700;font-size:14px;cursor:pointer}
@keyframes luIconPop{0%{transform:scale(0) rotate(-30deg);opacity:0}60%{transform:scale(1.3) rotate(8deg);opacity:1}100%{transform:scale(1) rotate(0)}}
@keyframes luTextIn{0%{opacity:0;transform:translateY(10px)}100%{opacity:1;transform:translateY(0)}}
.confetti{position:absolute;top:-10px;font-size:20px;animation:confFall linear forwards}
@keyframes confFall{0%{transform:translateY(0) rotate(0);opacity:1}100%{transform:translateY(110vh) rotate(360deg);opacity:0}}
.lu-rays{position:absolute;width:340px;height:340px;pointer-events:none;
  background:repeating-conic-gradient(from 0deg,rgba(255,209,102,.35) 0deg 4deg,transparent 4deg 18deg);
  border-radius:50%;animation:rayspin 6s linear infinite,rayfade .6s ease;z-index:-1}
@keyframes rayspin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
@keyframes rayfade{from{opacity:0;transform:scale(.5)}to{opacity:1;transform:scale(1)}}

/* ─── v6 ЧАСТЬ 3: ВСПЛЫВАЮЩИЕ УВЕДОМЛЕНИЯ (тосты) ─── */
#fxToasts{position:fixed;top:14px;left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:8px;z-index:7000;pointer-events:none}
.fx-toast{display:flex;align-items:center;gap:10px;background:var(--surf);border:1px solid var(--border);border-radius:12px;
  padding:10px 16px;box-shadow:0 6px 24px rgba(0,0,0,.4);opacity:0;transform:translateY(-14px) scale(.94);
  transition:opacity .28s ease,transform .28s ease;font-size:12px;max-width:88vw;line-height:1.4}
.fx-toast.show{opacity:1;transform:translateY(0) scale(1)}
.fx-toast b{color:var(--txt)}
.fx-chest-emoji{font-size:26px;animation:chestPopIn .5s ease}
@keyframes chestPopIn{0%{transform:scale(0) rotate(-20deg)}60%{transform:scale(1.25) rotate(6deg)}100%{transform:scale(1) rotate(0)}}

/* ─── CHEST MODAL ─── */
.chestbox{display:flex;flex-direction:column;align-items:center;gap:10px;padding:10px 0}
.chest-emoji{font-size:72px;cursor:pointer;transition:transform .15s;user-select:none}
.chest-emoji:hover{transform:scale(1.08)}
.chest-emoji.shaking{animation:chestShake .6s ease}
@keyframes chestShake{0%,100%{transform:rotate(0)}20%{transform:rotate(-8deg) scale(1.05)}40%{transform:rotate(8deg) scale(1.05)}60%{transform:rotate(-6deg) scale(1.1)}80%{transform:rotate(6deg) scale(1.1)}}
.chest-reward{font-size:84px;animation:rewardPop .55s cubic-bezier(.34,1.56,.64,1)}
@keyframes rewardPop{0%{transform:scale(0)}70%{transform:scale(1.25)}100%{transform:scale(1)}}
.rarity-tag{font-size:12px;font-weight:700;padding:4px 12px;border-radius:20px;letter-spacing:.5px;text-transform:uppercase}
.rarity-tag.common{background:#2a2d40;color:#aab0c4}
.rarity-tag.rare{background:#0d2a3a;color:#4fc3f7}
.rarity-tag.epic{background:#2a0d3a;color:#c77dff}
.rarity-tag.legendary{background:#3a2a0d;color:var(--yel);box-shadow:0 0 14px rgba(249,202,36,.5)}
.chest-list-item{display:flex;align-items:center;gap:10px;background:var(--surf2);border:1px solid var(--border);border-radius:9px;padding:9px 12px;margin-bottom:7px}
.chest-list-item .ce{font-size:26px}
.chest-list-item .ci{flex:1;font-size:12px;color:var(--txt2)}
.rules-h{font-size:12px;font-weight:700;color:var(--txt2);margin:14px 0 6px}
.rule-row{font-size:12px;line-height:1.5;padding:7px 9px;background:var(--surf2);border:1px solid var(--border);border-radius:8px;margin-bottom:5px}
.rule-row b{color:var(--yel);font-family:'JetBrains Mono',monospace}
.rule-sub{font-size:11px;color:var(--txt2);margin:2px 0 0 10px}
.chance-row{display:flex;align-items:center;gap:10px;margin-bottom:5px}
.chance-row b{font-family:'JetBrains Mono',monospace;min-width:52px}
.chance-n{font-size:10px;color:var(--txt2);margin-left:auto}

/* ─── COLLECTION GRID ─── */
.collgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:6px;margin-bottom:10px}
.collslot{aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:9px;border:1.5px solid var(--border);background:var(--surf2);font-size:22px;position:relative}
.collslot.owned.common{border-color:#aab0c4}
.collslot.owned.rare{border-color:#4fc3f7;box-shadow:0 0 8px rgba(79,195,247,.3)}
.collslot.owned.epic{border-color:#c77dff;box-shadow:0 0 8px rgba(199,125,255,.35)}
.collslot.owned.legendary{border-color:var(--yel);box-shadow:0 0 12px rgba(249,202,36,.5)}
.collslot.locked{opacity:.35;font-size:16px;color:var(--txt2)}
.collslot .cnt{position:absolute;bottom:1px;right:3px;font-size:8px;color:var(--txt2);font-family:'JetBrains Mono',monospace}
.colltabs{display:flex;gap:5px;margin-bottom:10px;flex-wrap:wrap}
.colltab{font-size:11px;padding:5px 10px;border-radius:14px;border:1px solid var(--border);background:var(--surf2);color:var(--txt2);cursor:pointer;font-weight:700}
.colltab.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.collstats{font-size:11px;color:var(--txt2);margin-bottom:8px}
.collstats b{color:var(--txt)}

/* ─── LEADERBOARD / COMPETITORS ─── */
.lbrow{display:flex;align-items:center;gap:10px;background:var(--surf2);border:1px solid var(--border);border-radius:9px;padding:9px 12px;margin-bottom:6px}
.lbrow.me{border-color:var(--acc);background:rgba(108,99,255,.08)}

<script>
'use strict';
// ══════════════════════════════════════════════════
//  🔥 FIREBASE CONFIG — ЗАПОЛНИТЕ ПОСЛЕ РЕГИСТРАЦИИ
//  Оставьте пустые строки ("") чтобы отключить синхронизацию
// ══════════════════════════════════════════════════
const FB_CONFIG = {
  apiKey:            "AIzaSyDP3eUSt460CL4O1q4nRszFZizHMysD-FE",
  authDomain:        "vita-17a8d.firebaseapp.com",
  databaseURL:       "https://vita-17a8d-default-rtdb.europe-west1.firebasedatabase.app",
  projectId:         "vita-17a8d",

  messagingSenderId: "1025016305956",
  appId:             "1:1025016305956:web:48738cc76af2740dc2fbb1"
};
const FB_LEGACY_PATH = "dtree_main"; // путь, где раньше (v4) лежали данные без авторизации

// ══════════════════════════════════════════════════
//  STATE
// ══════════════════════════════════════════════════
let S = {
  nodes:{},   // id→{id,x,y,text,type,tableId,checkboxes:[{checked,label}]}
  conns:[],   // [{id,from,to}]
  tables:{},  // id→{id,name,tasks:[{id,name}],entries:{dateKey:{taskId:true}},hrs?:{dateKey:{taskId:маска часов}},arch?:{…}} — hrs: частично отмеченные дни по часам (v9, часть 1 почасовой разметки); arch: архив дней старше 730 (часть 7, см. compactTableEntries)
  achiev:[],  // [{id,text,icon,cond:{type,nodeId,tableId,threshold}}]
  lastModified:0,  // v8: только информационное (время последней правки пользователем); В СРАВНЕНИЯХ НЕ УЧАСТВУЕТ
  rev:null,        // v8: токен ревизии облака, на которой основано это состояние (случайная строка, не время → часы устройств не важны)
  // ── v5 gamification ──
  settings:{
    mainNodeId:null,   // id рамки, чьи очки отслеживаются в лиге
    eventMin:-5,       // диапазон случайных событий конкурентов
    eventMax:15,
    soundOn:true,      // v6: звуковые эффекты (галочка/сундук/лига)
    fxOn:true          // v6: визуальные эффекты (тосты, конфетти-лучи)
  },
  game:{
    lastDailyCheck:null,   // последняя дата (YYYY-MM-DD), для которой уже прошла дневная проверка
    lastLeagueLevel:0,     // последний известный уровень лиги (для детекции level-up)
    grantedStepScore:0,    // v7 (часть 5): последний порог, кратный CHEST_STEP (30), за который выдан сундук «шаг очков»
    grantedJubilee:0,      // v7 (часть 5): последнее юбилейное число из ряда nextJubilee(), за которое выдан сундук
    grantedStreaks:{},     // {tableId:[7,30,...]} — уже выданные стрик-сундуки
    perfectDays:{},        // v7: {dateKey:true} — дни, где идеальны ВСЕ 24 часа (v9: единица учёта — час, см. блок «ИДЕАЛЬНЫЙ ДЕНЬ»)
    perfectHrs:{},         // v9: {dateKey:маска 24 бит} — дни, где идеальна только часть часов
    perfUnit:'h',          // v9: 'h' = счётчики ниже в часах; в старых сохранениях поля нет (= в днях) — migrate() переводит один раз
    perfectTotal:0,        // v7→v9: число идеальных ЧАСОВ за всё время (меняется на разницу числа идеальных часов дня)
    perfectStreak:0,       // v7→v9: текущая серия идеальных ЧАСОВ подряд (пересчитывается из масок при каждом persist())
    history:{d:{},w:{},m:{},y:{},fz:{max:null,sum:0,cnt:0,last:null,ld:null}}, // v7 (часть 4): очки лиги по слоям — см. блок «ИСТОРИЯ ОЧКОВ»
    chests:[],             // [{id,reason}] — невскрытые сундуки
    startDate:null,        // дата нажатия «Старт» гонки
    competitors:[],        // [{id,name,rate,eventTotal}]
    eventLog:[]            // [{date,text}] — лог случайных событий конкурентов
  },
  collection:{}             // {emojiId: count}
};
// ── v9 (часть 5): КАМЕРА (положение и масштаб холста) — только локально, НЕ в S ──
// Раньше камера лежала в S.cam и уезжала в облако, а конец каждого перетаскивания считался правкой пользователя
// (persist(true) → fbDirty → запись в облако). Теперь камера — отдельная переменная CAM с отдельным ключом localStorage
// этого устройства: она не попадает в облако, слияние, экспорт, подпись sigOf() и определение «есть неотправленные правки».
// Старые сохранения и снимки облака с полем cam: migrate() его выбрасывает; своя старая камера один раз берётся из локального сохранения.
const CAM_KEY='dtree_v5_cam';
let CAM={x:0,y:0,scale:1};
function loadCam(fallback){
  let c=null,fromOld=false;
  try{c=JSON.parse(localStorage.getItem(CAM_KEY));}catch(e){}
  if(!c){c=fallback;fromOld=true;}
  if(c&&isFinite(c.x)&&isFinite(c.y)&&isFinite(c.scale)&&c.scale>0){
    CAM={x:+c.x,y:+c.y,scale:+c.scale};
    if(fromOld)saveCam();
  }
}
function saveCam(){try{localStorage.setItem(CAM_KEY,JSON.stringify(CAM));}catch(e){}}
let _camT=null;
function camSaveSoon(){clearTimeout(_camT);_camT=setTimeout(saveCam,400);} // колесо / щипок: пишем, когда жест закончился
let uid=1;
const gid=p=>p+'_'+Date.now()+'_'+(uid++);

// ══════════════════════════════════════════════════
//  STORAGE  (IndexedDB + localStorage dual)
// ══════════════════════════════════════════════════
const SKEY='dtree_v5';
const SKEY_LEGACY='dtree_v4'; // ключ предыдущей версии — для бесшовной миграции
let idb=null;
// v7: true с момента нажатия «Стереть всё» до перезагрузки страницы. Пока флаг поднят,
// persist() и syncToFb() ничего не пишут — иначе автосейв (30 с) или слушатель Firebase
// мог бы «воскресить» старые данные между очисткой хранилищ и перезагрузкой.
let _resetting=false;

async function openIDB(){
  return new Promise((res,rej)=>{
    const r=indexedDB.open('DtreeDB',1);
    r.onupgradeneeded=e=>e.target.result.createObjectStore('d');
    r.onsuccess=e=>{res(e.target.result)};
    r.onerror=()=>rej(r.error);
  });
}

// v8: «подпись» содержимого — без служебных полей lastModified и rev. По ней отличаем РЕАЛЬНОЕ
// изменение данных от пустого вызова persist() (старт, 30-секундный таймер, повторное «Сохранить»).
// Раньше persist() каждый раз ставил lastModified=Date.now() — и устройство с устаревшими данными
// «обновлялось» само при старте и по таймеру, а потом перезаписывало облако. Это и была главная причина потерь.
const sigOf=o=>{const {lastModified,rev,...rest}=o;return JSON.stringify(rest);};
let _lastSig=null,_lastRev=null;

// ══════════════════════════════════════════════════
//  v9 (часть 4): РЕЖИМ «ТОЛЬКО ПРОСМОТР»
// ══════════════════════════════════════════════════
// Это локальная настройка УСТРОЙСТВА: лежит в отдельном ключе localStorage, а не в S — поэтому не попадает ни в облако,
// ни в экспорт, ни в слияние устройств. Переживает перезапуск; выключается всегда и без условий (кнопка 👁 и плашка).
// Блокируются только действия пользователя, меняющие данные: каждый такой обработчик начинается с roGuard() (при включённом
// режиме он мигает плашкой и возвращает true). Облако не затронуто: получение данных и отправка уже сделанных правок идут
// через persist(false) / syncToFb(). Камера (перемещение и масштаб) — это просмотр: хранится только локально, отдельно от данных (CAM / saveCam(), см. v9 часть 5).
// Страховка: persist() с правкой пользователя в этом режиме откатывает состояние к последнему сохранённому (roRollback).
const RO_KEY='dtree_v5_readonly';
let roMode=false;
try{roMode=localStorage.getItem(RO_KEY)==='1';}catch(e){}
function roGuard(){
  if(!roMode)return false;
  const b=document.getElementById('ro-banner');
  if(b){b.classList.remove('flash');void b.offsetWidth;b.classList.add('flash');}
  return true;
}
function roApplyUi(){
  document.body.classList.toggle('ro',roMode);
  const b=document.getElementById('bRO');
  if(b){b.classList.toggle('on',roMode);b.textContent=roMode?'👁 Просмотр: вкл':'👁 Просмотр';}
}
function roRollback(){
  if(_lastSig==null)return;
  try{
    const keep={lastModified:S.lastModified,rev:S.rev};
    S=Object.assign(JSON.parse(_lastSig),keep); // _lastSig — содержимое последнего сохранения без служебных lastModified / rev
    renderAll();
  }catch(e){console.warn('RO: откат не удался',e);}
}
function setReadOnly(on){
  if(on){ // сначала фиксируем начатое редактирование и сбрасываем режимы «стрелка / удалить», потом закрываем правки
    try{if(document.activeElement&&document.activeElement.blur)document.activeElement.blur();}catch(e){}
    setMode('nav');dragging=null;panning=null;
  }
  roMode=!!on;
  try{localStorage.setItem(RO_KEY,roMode?'1':'0');}catch(e){}
  roApplyUi();
  renderAll();
}
roApplyUi();

// userEdit=true (по умолчанию) — вызов вызван действием пользователя: если данные реально изменились,
// состояние помечается «есть неотправленные правки» (fbDirty). userEdit=false — старт, таймер,
// применение чужих данных, служебные пересчёты: сохраняем локально, но в облако сами по себе не пишем.
async function persist(userEdit=true){
  if(_resetting)return; // v7: идёт полный сброс — ничего не сохраняем
  if(roMode&&userEdit){roRollback();return;} // v9 (часть 4): режим просмотра — правка пользователя не сохраняется и откатывается
  compactTablesData(); // v7 (часть 7): старые дни таблиц и идеальные дни → в компактный архив (очки и серии не меняются)
  recomputeProgress(); // v5: проверка лиги/сундуков/стриков перед сохранением
  refreshStatsIfOpen(); // v7 (часть 4): если модалка статистики открыта — график сразу показывает новую сегодняшнюю точку
  const sig=sigOf(S);
  const contentChanged=sig!==_lastSig;
  if(contentChanged){
    _lastSig=sig;
    if(userEdit){S.lastModified=Date.now();fbDirty=true;fbSaveDirty();}
  }
  if(contentChanged||S.rev!==_lastRev){
    _lastRev=S.rev;
    const json=JSON.stringify(S);
    if(idb){
      try{
        await new Promise((res,rej)=>{
          const tx=idb.transaction('d','readwrite');
          tx.objectStore('d').put(json,SKEY);
          tx.oncomplete=res;tx.onerror=rej;
        });
      }catch(e){}
    }
    try{localStorage.setItem(SKEY,json);}catch(e){}
  }
  const t=new Date().toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'});
  document.getElementById('sstatus').textContent='✓ Сохранено '+t;
  // Облако: только если есть неотправленные правки пользователя (syncToFb сама ждёт первый снимок облака)
  if(fbDirty&&!fbReceiving)syncToFb();
}

async function restore(){
  // Try IDB (new v5 key first, then legacy v4 key)
  if(idb){
    try{
      const tryGet=key=>new Promise((res,rej)=>{
        const tx=idb.transaction('d','readonly');
        const rq=tx.objectStore('d').get(key);
        rq.onsuccess=()=>res(rq.result);rq.onerror=rej;
      });
      const r=await tryGet(SKEY);
      if(r)return JSON.parse(r);
      const legacy=await tryGet(SKEY_LEGACY);
      if(legacy){console.log('Найдены данные предыдущей версии (IDB) — мигрируем.');return JSON.parse(legacy);}
    }catch(e){}
  }
  // localStorage fallback (new key, then legacy key)
  try{const r=localStorage.getItem(SKEY);if(r)return JSON.parse(r);}catch(e){}
  try{
    const legacy=localStorage.getItem(SKEY_LEGACY);
    if(legacy){console.log('Найдены данные предыдущей версии (localStorage) — мигрируем.');return JSON.parse(legacy);}
  }catch(e){}
  return null;
}

function migrate(s){
  // bool[] → {checked,label}[]
  Object.values(s.nodes||{}).forEach(n=>{
    if(!Array.isArray(n.checkboxes))n.checkboxes=[];
    n.checkboxes=n.checkboxes.map((v,i)=>
      typeof v==='boolean'?{checked:v,label:'Галочка '+(i+1)}:v
    );
  });
  delete s.cam; // v9 (часть 5): камера больше не часть данных (см. CAM) — вычищаем поле из старых сохранений, бэкапов и снимков облака
  if(!s.achiev)s.achiev=[];
  if(!s.lastModified)s.lastModified=0;
  if(s.rev===undefined)s.rev=null; // v8
  // ── v5: backfill gamification fields for old (v4 and earlier) saves ──
  if(!s.settings)s.settings={};
  if(s.settings.mainNodeId===undefined)s.settings.mainNodeId=null;
  if(typeof s.settings.eventMin!=='number')s.settings.eventMin=-5;
  if(typeof s.settings.eventMax!=='number')s.settings.eventMax=15;
  if(typeof s.settings.soundOn!=='boolean')s.settings.soundOn=true; // v6: звук включён по умолчанию
  if(typeof s.settings.fxOn!=='boolean')s.settings.fxOn=true;       // v6: визуальные эффекты включены по умолчанию
  if(!s.game)s.game={};
  // v7 (часть 2): штрафов и замочков больше нет — вычищаем устаревшие поля старых сохранений.
  delete s.settings.penalty;delete s.game.penaltyAccum;delete s.game.penalizedDays;
  if(s.game.lastDailyCheck===undefined)s.game.lastDailyCheck=null;
  if(typeof s.game.lastLeagueLevel!=='number')s.game.lastLeagueLevel=0;
  // v7 (часть 5): «каждые 100 очков» (grantedRoundScore) заменено двумя триггерами — шаг 30 и юбилейные числа.
  // Старый порог берём как начальный для шага, чтобы не выдать лишнего; пити-таймер удалён совсем.
  if(typeof s.game.grantedStepScore!=='number')s.game.grantedStepScore=(typeof s.game.grantedRoundScore==='number')?s.game.grantedRoundScore:0;
  if(typeof s.game.grantedJubilee!=='number')s.game.grantedJubilee=0;
  delete s.game.grantedRoundScore;delete s.game.opensSinceLegendary;
  if(!s.game.grantedStreaks)s.game.grantedStreaks={};
  // v7 (часть 7): архивы старых дней (таблицы и идеальные дни). Повреждённый архив проще отбросить, чем читать.
  if(s.game.perfectArch&&(typeof s.game.perfectArch.to!=='string'||typeof s.game.perfectArch.tail!=='number'))delete s.game.perfectArch;
  Object.values(s.tables||{}).forEach(t=>{
    if(!t.entries||typeof t.entries!=='object')t.entries={};
    normalizeTableHours(t); // v9: почасовые отметки (старые сохранения без t.hrs проходят без изменений)
    const a=t.arch;
    if(a&&(typeof a.to!=='string'||typeof a.total!=='number'||typeof a.tail!=='number'||typeof a.best!=='number'||typeof a.days!=='number'))delete t.arch;
  });
  // v9 (часть 2): идеальные ЧАСЫ — perfectDays / perfectHrs / perfUnit / perfGrace и счётчики в часах;
  // перевод старых сохранений из дней в часы (ровно один раз) и нормализация масок — см. migratePerfect().
  migratePerfect(s.game);
  // v7 (часть 4): история хранится слоями d/w/m/y (дни/недели/месяцы/годы) + fz (скаляры свёрнутой части).
  // Старый плоский формат {dateKey:score} просто переносится в слой дней (дальше его свернёт compactHistory).
  {
    let h=s.game.history;
    if(!h||typeof h!=='object'||Array.isArray(h))h={};
    if(!h.d||typeof h.d!=='object'){
      const old=h;h={d:{}};
      Object.keys(old).forEach(k=>{if(/^\d{4}-\d\d-\d\d$/.test(k)&&typeof old[k]==='number')h.d[k]=old[k];});
    }
    ['w','m','y'].forEach(t=>{if(!h[t]||typeof h[t]!=='object')h[t]={};});
    if(!h.fz||typeof h.fz!=='object')h.fz={};
    const fz=h.fz;
    if(typeof fz.sum!=='number')fz.sum=0;
    if(typeof fz.cnt!=='number')fz.cnt=0;
    if(typeof fz.max!=='number')fz.max=null;
    if(typeof fz.last!=='number')fz.last=null;
    if(typeof fz.ld!=='string')fz.ld=null;
    s.game.history=h;
  }
  if(!Array.isArray(s.game.chests))s.game.chests=[];
  if(s.game.startDate===undefined)s.game.startDate=null;
  if(!Array.isArray(s.game.competitors))s.game.competitors=[];
  if(!Array.isArray(s.game.eventLog))s.game.eventLog=[];
  if(!s.collection)s.collection={};
  return s;
}

function localKey(d){
  const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),dd=String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${dd}`;
}
function todayKey(){return localKey(new Date());}

// ══════════════════════════════════════════════════
//  ЧАСЫ ВНУТРИ ДНЯ ЯЧЕЙКИ ТАБЛИЦЫ (v9, часть 1 почасовой разметки)
// ══════════════════════════════════════════════════
/*
  Ячейка таблицы = (день, привычка). Раньше она была булевой, теперь внутри неё 24 часа (бит h = час h:00–h+1:00).
  Хранение — без дублирования и без миграции старых данных:
    • день отмечен ЦЕЛИКОМ (все 24 часа)  → t.entries[день][привычка]=true — ровно как раньше, поэтому
      nodeVal() / streak() / архив / статистика / очки / сундуки продолжают работать БЕЗ изменений, а все старые
      отметки автоматически читаются как «отмечены все 24 часа»;
    • отмечена только ЧАСТЬ часов          → t.hrs[день][привычка]=маска (1…2^24−2); entries для этой ячейки нет,
      поэтому значение таблицы не растёт (+1 только за полностью выполненный день);
    • ничего не отмечено                   → нет записей вообще.
  Итого полный день и «все 24 часа» — одно и то же состояние, расхождения невозможны по построению;
  normalizeTableHours() дополнительно чинит редкие рассинхроны после слияния данных двух устройств.
*/
const HOURS=24,HFULL=(1<<HOURS)-1;
function popcnt(m){let n=0;m=m>>>0;while(m){m&=m-1;n++;}return n;}
// Маска отмеченных часов ячейки (старые «галочки» entries=true читаются как полный день).
function cellMask(t,dk,tk){
  const e=t.entries&&t.entries[dk];
  if(e&&e[tk])return HFULL;
  const h=t.hrs&&t.hrs[dk];
  const m=h&&h[tk];
  return(typeof m==='number')?(m&HFULL):0;
}
// Записывает маску ячейки, поддерживая инвариант хранения (см. выше). Ничего не пересчитывает — только данные.
function setCellMask(t,dk,tk,mask){
  mask=mask&HFULL;
  if(!t.entries)t.entries={};
  if(mask===HFULL){
    (t.entries[dk]||(t.entries[dk]={}))[tk]=true;
  }else if(t.entries[dk]){
    delete t.entries[dk][tk];
    if(!Object.keys(t.entries[dk]).length)delete t.entries[dk];
  }
  if(mask===HFULL||mask===0){
    if(t.hrs&&t.hrs[dk]){
      delete t.hrs[dk][tk];
      if(!Object.keys(t.hrs[dk]).length)delete t.hrs[dk];
      if(!Object.keys(t.hrs).length)delete t.hrs;
    }
  }else{
    if(!t.hrs)t.hrs={};
    (t.hrs[dk]||(t.hrs[dk]={}))[tk]=mask;
  }
}
// Приводит t.hrs к инварианту: мусор выбрасывается, полная маска → entries=true, пустая → удаляется,
// если день уже целиком отмечен в entries — entries главнее. Возвращает true, если что-то изменилось.
function normalizeTableHours(t){
  if(t.hrs===undefined)return false;
  if(!t.hrs||typeof t.hrs!=='object'||Array.isArray(t.hrs)){delete t.hrs;return true;}
  if(!t.entries)t.entries={};
  let ch=false;
  for(const dk of Object.keys(t.hrs)){
    const day=t.hrs[dk];
    if(!_DATE_RE.test(dk)||!day||typeof day!=='object'||Array.isArray(day)){delete t.hrs[dk];ch=true;continue;}
    for(const tk of Object.keys(day)){
      const raw=day[tk];
      if(typeof raw!=='number'||!isFinite(raw)){delete day[tk];ch=true;continue;}
      const m=raw&HFULL;
      if(t.entries[dk]&&t.entries[dk][tk]){delete day[tk];ch=true;continue;}
      if(m===HFULL){(t.entries[dk]||(t.entries[dk]={}))[tk]=true;delete day[tk];ch=true;continue;}
      if(m===0){delete day[tk];ch=true;continue;}
      if(m!==raw){day[tk]=m;ch=true;}
    }
    if(!Object.keys(day).length){delete t.hrs[dk];ch=true;}
  }
  if(!Object.keys(t.hrs).length){delete t.hrs;ch=true;}
  return ch;
}

//  VALUE COMPUTATION
// ══════════════════════════════════════════════════
function nodeVal(id){
  const n=S.nodes[id];if(!n)return 0;
  if(n.type==='table'&&n.tableId){
    const t=S.tables[n.tableId];if(!t)return 0;
    // v7 (часть 7): значение = отметки в архиве (старше 730 дней, хранятся числом) + отметки в живых entries.
    // Записи entries за дни ≤ arch.to уже учтены в архиве и игнорируются — двойного счёта быть не может.
    const a=t.arch,E=t.entries||{};
    let s=a?a.total:0;
    for(const k in E){if(a&&k<=a.to)continue;for(const v of Object.values(E[k]))if(v)s++;}
    return s;
  }
  const ch=S.conns.filter(c=>c.from===id);
  if(!ch.length)return(n.checkboxes||[]).filter(v=>v.checked).length;
  return ch.reduce((a,c)=>a+nodeVal(c.to),0);
}

function streak(tableId){
  const t=S.tables[tableId];if(!t)return 0;
  const E=t.entries||{},a=t.arch;
  let s=0;const d=new Date();
  for(let i=0;i<99999;i++){
    const k=localKey(d);
    // v7 (часть 7): дошли до архивной части — серия продолжается на arch.tail дней (серия активных дней,
    // заканчивающаяся ровно в день arch.to); глубже в живых entries не заглядываем.
    if(a&&k<=a.to){if(k===a.to)s+=a.tail;break;}
    const e=E[k];
    if(!e||!Object.values(e).some(Boolean))break;
    s++;d.setDate(d.getDate()-1);
  }
  return s;
}

// ══════════════════════════════════════════════════
//  СЖАТИЕ СТАРЫХ ДАННЫХ ТАБЛИЦ ПРИВЫЧЕК (v7, часть 7)
// ══════════════════════════════════════════════════
/*
  Проблема: календарь таблицы показывает 730 дней, а хранилище росло бесконечно — в entries копились все дни
  за всё время (плюс openTable() при каждом открытии создавал пустые {} на все 730 дней). Всё это целиком
  уходит в IndexedDB / localStorage / Firebase (JSON.stringify(S)) при каждом сохранении.

  Решение: дни СТАРШЕ TBL_KEEP_DAYS (730) переезжают из t.entries в компактный архив t.arch, а из entries удаляются.
  Вручную отметить такой день и так нельзя (он за пределами календаря), так что сжатие ничего не отнимает у UI.
    arch.to    — архив покрывает ВСЕ дни ≤ to (граница сдвигается на день вперёд каждый день);
    arch.total — всего отметок в архиве → nodeVal() (очки лиги не меняются!);
    arch.days  — дней хотя бы с одной отметкой; arch.best — самая длинная серия таких дней внутри архива;
    arch.tail  — серия активных дней, заканчивающаяся ровно в день to → streak() не обрезается на 730 днях
                 (серия в 800 дней останется 800, награды за стрики не «откатываются»);
    arch.y     — по годам: {d: дней с отметками, c: отметок, t: {id привычки: отметок}} — «что-то подобное по смыслу»
                 вместо потерянных данных: видно, сколько раз и когда выполнялась каждая привычка.
  Рост хранилища: одна запись года на таблицу (≈ 0.3 КБ при 10 привычках) — практически плоско. Помесячную
  детализацию не храним сознательно: она лишь множила бы записи, а UI её не использует.
  Решения по неоднозначностям: (1) пустые дни и false-флаги не храним вообще — все читатели проверяют значение
  на истинность, поэтому entries[день]={} и {x:false} равны «нет записи»; (2) если в entries оказались записи ≤ arch.to
  (например, ручной импорт), они считаются дубликатами архива и выбрасываются — «архив главнее»; (3) то же
  сжатие делается для S.game.perfectDays (множество идеальных дней, ~13 байт/день) — см. archivePerfectDays().
*/
const TBL_KEEP_DAYS=730; // сколько последних дней показывает и позволяет править календарь таблицы
const _DATE_RE=/^\d{4}-\d\d-\d\d$/;

// Сжимает одну таблицу: дни ≤ boundary уходят в t.arch. Идемпотентна. Возвращает true, если что-то изменилось.
function compactTableEntries(t,boundary){
  const E=t.entries||(t.entries={});
  let changed=false;
  // (а) нормализация: не храним пустые дни и false-флаги
  for(const k of Object.keys(E)){
    const day=E[k];
    if(!day||typeof day!=='object'){delete E[k];changed=true;continue;}
    let any=false;
    for(const id of Object.keys(day)){if(day[id])any=true;else{delete day[id];changed=true;}}
    if(!any){delete E[k];changed=true;}
  }
  // (а-2) v9: почасовые отметки приводим к инварианту; частичные дни ≤ границы / ≤ arch.to не архивируем —
  //        день, не выполненный целиком, ни в значение таблицы, ни в серии не входит (как и раньше).
  if(normalizeTableHours(t))changed=true;
  if(t.hrs){
    const cut=(t.arch&&typeof t.arch.to==='string'&&t.arch.to>boundary)?t.arch.to:boundary;
    for(const dk of Object.keys(t.hrs))if(dk<=cut){delete t.hrs[dk];changed=true;}
    if(!Object.keys(t.hrs).length){delete t.hrs;changed=true;}
  }
  // (б) перенос дней ≤ границы в архив
  let a=t.arch;
  const old=(a&&typeof a.to==='string')?a.to:null;
  const B=(old&&old>boundary)?old:boundary; // граница никогда не откатывается назад (сдвиг часов / часового пояса)
  const todo=Object.keys(E).filter(k=>_DATE_RE.test(k)&&k<=B).sort();
  if(!a){
    if(!todo.length)return changed;
    a=t.arch={to:null,tail:0,best:0,total:0,days:0,y:{}};
  }
  if(!a.y||typeof a.y!=='object')a.y={};
  let prev=old,run=old?(a.tail||0):0,best=a.best||0;
  for(const k of todo){
    if(old&&k<=old){delete E[k];changed=true;continue;} // уже покрыто архивом → дубликат
    if(prev&&ymdAddDays(prev,1)!==k)run=0;               // между prev и k были дни без отметок → серия прервана
    run++;if(run>best)best=run;prev=k;
    const Y=a.y[k.slice(0,4)]||(a.y[k.slice(0,4)]={d:0,c:0,t:{}});
    let n=0;
    for(const id of Object.keys(E[k])){if(E[k][id]){n++;Y.t[id]=(Y.t[id]||0)+1;}}
    Y.d++;Y.c+=n;a.days++;a.total+=n;
    delete E[k];changed=true;
  }
  if(prev!==B)run=0; // последние дни до границы без отметок → серия на границе равна 0
  if(a.to!==B||a.tail!==run||a.best!==best){a.to=B;a.tail=run;a.best=best;changed=true;}
  return changed;
}

// Идеальные часы: те же правила — дни ≤ boundary вычёркиваются из perfectDays / perfectHrs, а серию на границе помнит
// perfectArch.tail (v9: в ЧАСАХ — идеальные часы подряд, заканчивающиеся в 23:00 дня to).
// perfectTotal (общее число идеальных часов) хранится отдельным числом и не меняется.
function archivePerfectDays(boundary){
  const G=S.game,P=G.perfectDays,H=G.perfectHrs||(G.perfectHrs={});
  let a=G.perfectArch;
  const old=(a&&typeof a.to==='string')?a.to:null;
  const B=(old&&old>boundary)?old:boundary;
  const keys=Object.keys(P).filter(k=>k<=B),hkeys=Object.keys(H).filter(k=>k<=B);
  if(!keys.length&&!hkeys.length&&!old)return false;
  // серия идеальных часов, заканчивающаяся ровно в 23:00 дня B (может продолжаться в уже заархивированной части)
  let run=0,k=B;
  for(let guard=0;guard<40000;guard++){
    if(old&&k===old){run+=(a.tail||0);break;}
    const r=runDown(perfMaskIn(G,k),HOURS-1);
    run+=r;
    if(r<HOURS)break; // цепочка оборвалась внутри дня
    k=ymdAddDays(k,-1);
  }
  keys.forEach(x=>delete P[x]);hkeys.forEach(x=>delete H[x]);
  G.perfectArch={to:B,tail:run};
  return true;
}

// ══════════════════════════════════════════════════
//  FIREBASE SYNC  (v5: анонимная авторизация + общий "Sync ID")
//
//  ВАЖНО: анонимная авторизация Firebase создаёт РАЗНЫЙ uid на каждом
//  устройстве/браузере — если использовать путь /users/{auth.uid}/ буквально,
//  телефон и ноутбук получат два разных uid и НЕ будут синхронизироваться
//  друг с другом (каждое устройство будет писать в свою изолированную ветку).
//  Чтобы реально работала синхронизация между несколькими устройствами одного
//  человека (а это явно нужно — пользователь использует Blackview Shark 9 +
//  Windows 7 + Windows 11), используется отдельный случайный "Sync ID"
//  (128-битная случайная строка, как пароль), который один раз копируется
//  в Настройках с одного устройства на другие. Анонимная авторизация всё
//  равно обязательна — без неё Firebase Realtime Database вообще не пустит
//  ни читать, ни писать (см. правила безопасности в инструкции).
// ══════════════════════════════════════════════════
let fbDb=null,fbListening=false,fbReceiving=false,fbTimer=null;
// ── v8: протокол синхронизации ──
// • S.rev — токен ревизии облака, на которой основано локальное состояние (случайная строка; время не используется).
// • fbDirty — есть локальные правки пользователя, ещё не доехавшие до облака (хранится в localStorage, переживает перезапуск).
// • fbBase — JSON последнего известного состояния облака; база для трёхстороннего слияния при конфликте.
// • fbSynced — получен первый снимок облака для текущей ветки. До этого момента писать в облако ЗАПРЕЩЕНО.
// • Запись в облако — только через runTransaction с проверкой «rev облака == мой базовый rev».
//   Если облако ушло вперёд, запись отклоняется, устройство забирает облако, СЛИВАЕТ с локальными правками и повторяет.
let fbDirty=false,fbBase=null,fbSynced=false,fbOnline=false,fbPushing=false,fbQueued=false;
const newToken=()=>Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,10);
function fbLoadMeta(){try{fbDirty=localStorage.getItem('dtree_dirty')==='1';fbBase=localStorage.getItem('dtree_syncbase');}catch(e){}}
function fbSaveDirty(){try{localStorage.setItem('dtree_dirty',fbDirty?'1':'0');}catch(e){}}
function fbSetBase(raw){fbBase=raw;try{localStorage.setItem('dtree_syncbase',raw);}catch(e){}}
let fbUid=null,fbSyncId=null,fbUserPath=null;
let fbPermDenied=false; // true — Firebase права не разрешены, бесполезно повторять
let fbLastError=null;   // последняя ошибка Firebase для диагностики

function randomSyncId(){
  const chars='abcdefghijklmnopqrstuvwxyz0123456789';
  let s='';for(let i=0;i<22;i++)s+=chars[Math.floor(Math.random()*chars.length)];
  return s;
}
function getOrCreateSyncId(){
  let id=null;
  try{id=localStorage.getItem('dtree_syncid');}catch(e){}
  if(!id){
    id=randomSyncId();
    try{localStorage.setItem('dtree_syncid',id);}catch(e){}
  }
  return id;
}
// Переключение на другой Sync ID (используется при "привязке" нового устройства
// к уже существующим данным — ввод ID, скопированного с первого устройства).
function reconnectSync(newId){
  newId=(newId||'').trim().toLowerCase();
  if(!newId)return;
  try{localStorage.setItem('dtree_syncid',newId);}catch(e){}
  const oldPath=fbUserPath;
  fbSyncId=newId;
  fbUserPath='sync/'+newId+'/data';
  fbPermDenied=false; // сбрасываем флаг — даём новый шанс при смене ID
  // v8: новая ветка — начинаем «с нуля»: ждём её первый снимок. Если в облаке по этому ID есть данные, они
  // заменят локальные (как «привязка к существующим данным»); если пусто — зальём локальные.
  fbSynced=false;fbDirty=false;fbSaveDirty();fbBase=null;
  try{localStorage.removeItem('dtree_syncbase');}catch(e){}
  clearTimeout(fbTimer);S.rev=null;
  fbLastError=null;
  if(fbDb){
    if(oldPath)try{fbDb.ref(oldPath).off();}catch(e){}
    fbListening=false;
    startFbListener();
  }
}

// Трёхстороннее слияние JSON: b — база (последнее известное облако), l — локальное, r — удалённое.
// Что менялось только с одной стороны — берём эту сторону; удаление побеждает, если вторая сторона
// объект не трогала; одно и то же поле, изменённое с обеих сторон, — побеждает локальное (последнее
// действие пользователя на ЭТОМ устройстве). Массивы с полем id (conns, achiev, tasks…) сливаются как словари;
// прочие массивы (чекбоксы, логи) — целиком (локальный вариант, если он менялся). Ничего не теряется «молча»
// на уровне рамок/связей/таблиц/дней: новые рамки и отметки с обеих сторон сохраняются.
const _j=x=>JSON.stringify(x);
const _isO=x=>x!==null&&typeof x==='object'&&!Array.isArray(x);
const _isIdArr=a=>Array.isArray(a)&&a.length>0&&a.every(e=>_isO(e)&&typeof e.id==='string');
function m3(b,l,r){
  if(_j(l)===_j(r))return l;
  if(_j(b)===_j(l))return r;
  if(_j(b)===_j(r))return l;
  if(_isO(l)&&_isO(r)){
    const bo=_isO(b)?b:{},o={};
    for(const k of new Set([...Object.keys(l),...Object.keys(r)])){
      const inL=k in l,inR=k in r;
      if(inL&&inR)o[k]=m3(bo[k],l[k],r[k]);
      else if(inL){if(!(k in bo)||_j(bo[k])!==_j(l[k]))o[k]=l[k];}  // справа удалено: оставляем, только если мы это меняли/добавили
      else{if(!(k in bo)||_j(bo[k])!==_j(r[k]))o[k]=r[k];}          // слева удалено: оставляем, только если справа это менялось/добавлено
    }
    return o;
  }
  if(_isIdArr(l)&&_isIdArr(r)){
    const toM=a=>Object.fromEntries(a.map(e=>[e.id,e]));
    const mm=m3(_isIdArr(b)?toM(b):{},toM(l),toM(r));
    return [...new Set([...l.map(e=>e.id),...r.map(e=>e.id)])].filter(id=>id in mm).map(id=>mm[id]);
  }
  return l; // атомарные значения / массивы без id
}

// Применить снимок облака (raw — JSON-строка). Возвращает true, если локальное состояние изменилось.
// Нет локальных правок → просто принимаем облако (какой бы rev ни был — сравнение по равенству токенов, а не по времени).
// Есть неотправленные правки → сливаем с облаком (m3), результат остаётся «грязным» и будет отправлен.
function fbApplyRemote(raw){
  if(_resetting||!raw)return false;
  let remote;
  try{remote=migrate(JSON.parse(raw));}catch(e){console.error('FB parse:',e);return false;}
  if((remote.rev||null)===(S.rev||null))return false; // это уже наше состояние (в т.ч. эхо собственной записи)
  if(!fbDirty){
    S=remote;
  }else{
    let base=null;try{base=fbBase?migrate(JSON.parse(fbBase)):null;}catch(e){} // v9: база приводится к тем же единицам (часы), что и обе стороны слияния
    if(base&&(base.rev||null)!==(S.rev||null))base=null; // база от другого снимка — для слияния не годится
    const lm=S.lastModified;
    const merged=m3(base||{},S,remote);
    merged.rev=remote.rev;merged.lastModified=lm;
    S=migrate(merged);
    fbDirty=sigOf(S)!==sigOf(remote); // слияние совпало с облаком — отправлять нечего
  }
  fbSetBase(raw);fbSaveDirty();
  fbReceiving=true;
  renderAll();renderLeagueBar();
  persist(false).then(()=>{fbReceiving=false;});
  return true;
}

function syncToFb(immediate=false){
  if(_resetting)return; // v7: идёт полный сброс — не заливаем старые данные обратно в облако
  if(!fbDb||!fbUserPath||fbPermDenied)return;
  if(!fbDirty)return; // v8: нет неотправленных правок пользователя — в облако не пишем (ни при старте, ни по таймеру)
  if(!fbSynced){setFbSt('⏳ Ждём облако…','sync');return;} // v8: пока не пришёл первый снимок облака — не пишем
  if(!fbOnline)return; // офлайн: отправим при появлении связи (см. .info/connected)
  if(immediate){fbPush();return;}
  clearTimeout(fbTimer);
  fbTimer=setTimeout(fbPush,700);
}

// Отправка через транзакцию: запись проходит, только если ревизия в облаке всё ещё та, на которой основано
// наше состояние. Иначе — забираем облако, сливаем, повторяем (до 4 попыток).
async function fbPush(){
  if(_resetting||!fbDirty||!fbSynced||!fbDb||!fbUserPath||fbPermDenied||!fbOnline)return;
  if(fbPushing){fbQueued=true;return;}
  fbPushing=true;
  try{
    for(let attempt=0;attempt<4&&fbDirty;attempt++){
      const snap=JSON.parse(JSON.stringify(S)); // снимок на момент отправки (S может измениться во время await)
      const baseRev=snap.rev||null;
      const newRev=newToken();
      const out=JSON.stringify(Object.assign({},snap,{rev:newRev}));
      setFbSt('⬆ Синхр…','sync');
      // applyLocally=false: промежуточное значение не показывается слушателям, пока сервер не подтвердил запись
      const res=await fbDb.ref(fbUserPath).transaction(cur=>{
        if(cur!=null){
          let r=null;try{r=JSON.parse(cur);}catch(e){}
          if(r&&(r.rev||null)!==baseRev)return; // облако ушло вперёд — отмена
        }
        return out;
      },undefined,false);
      if(res.committed){
        const unchanged=sigOf(S)===sigOf(snap); // пользователь мог внести ещё правки, пока шла отправка
        S.rev=newRev;fbSetBase(out);
        if(unchanged)fbDirty=false;
        fbSaveDirty();
        setFbSt('☁ '+new Date().toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'}),'ok');
        await persist(false); // сохраняем новый rev локально
        break;
      }
      // Отмена: облако изменилось с другого устройства. Берём его и сливаем с нашими правками.
      const fresh=await fbDb.ref(fbUserPath).once('value');
      fbApplyRemote(fresh.val());
    }
  }catch(e){
    fbLastError=(e.code||e.message||String(e));
    const isPermission=(fbLastError.toLowerCase().includes('permission')||fbLastError.toLowerCase().includes('denied'));
    if(isPermission){fbPermDenied=true;setFbSt('🔴 Нет прав (tap ℹ)','err');}
    else setFbSt('🔴 Ошибка','err');
    console.error('FB write:',e);
  }finally{
    fbPushing=false;
    if(fbQueued){fbQueued=false;syncToFb();}
  }
}

function startFbListener(){
  if(!fbDb||!fbUserPath||fbListening)return;
  fbListening=true;
  fbSynced=false; // v8: для этой ветки первый снимок ещё не получен
  // Connection state
  fbDb.ref('.info/connected').on('value',snap=>{
    fbOnline=!!snap.val();
    if(fbOnline){
      if(!fbPermDenied)setFbSt('☁ Подключено','ok');
      if(fbDirty&&fbSynced)syncToFb(); // связь вернулась — отправляем накопленные офлайн правки
    } else {
      setFbSt('🔴 Нет связи','err');
    }
  });
  // Data listener (общая ветка по Sync ID)
  fbDb.ref(fbUserPath).on('value',snap=>{
    const raw=snap.val();
    fbSynced=true; // первый снимок получен — с этого момента запись разрешена (сама запись идёт через транзакцию)
    if(!raw){
      // Облако пусто. Заливаем локальное, только если это устройство ещё ни разу не синхронизировалось
      // (чистое устройство, первая заливка) или есть неотправленные правки. Иначе облако только что сбросили
      // с другого устройства (fullReset) — не «воскрешаем» своё старое состояние, ждём новое.
      if(!fbDirty&&!fbBase&&Object.keys(S.nodes).length){fbDirty=true;fbSaveDirty();}
      if(fbDirty)syncToFb(true);
      return;
    }
    const applied=fbApplyRemote(raw);
    setFbSt(applied?(fbDirty?'⇄ Слито':'⬇ Обновлено'):'☁ Актуально','ok');
    if(fbDirty)syncToFb(true);
  }, err=>{
    // Ошибка чтения — чаще всего permission_denied (неверные правила или нет авторизации)
    fbListening=false; // сбрасываем флаг чтобы можно было переподключиться
    fbLastError=(err.code||err.message||String(err));
    fbPermDenied=true;
    setFbSt('🔴 Нет прав (tap ℹ)','err');
    console.error('FB listener error:', err);
  });
}

// Бесшовная миграция: если в новой ветке (sync/{id}/data) ещё нет данных,
// но в старом общем пути (FB_LEGACY_PATH, использовался в v4 без авторизации)
// что-то есть — переносим один раз.
async function migrateLegacyFbData(){
  // v7: после полного сброса (см. fullReset) миграция отключается навсегда. Иначе, раз ветка
  // sync/{id}/data только что удалена, этот код подтянул бы из старого общего пути
  // FB_LEGACY_PATH прежние данные v4 — «фантом», ради борьбы с которым и делался сброс.
  try{if(localStorage.getItem('dtree_nolegacy')==='1')return;}catch(e){}
  try{
    const mineSnap=await fbDb.ref(fbUserPath).once('value');
    if(mineSnap.exists())return; // данные уже есть — ничего не делаем
    const legacySnap=await fbDb.ref(FB_LEGACY_PATH).once('value');
    if(legacySnap.exists()){
      await fbDb.ref(fbUserPath).set(legacySnap.val());
      console.log('✅ Старые данные из "'+FB_LEGACY_PATH+'" перенесены в "'+fbUserPath+'"');
    }
  }catch(e){
    console.warn('Миграция старых Firebase-данных не удалась (это не критично):',e);
  }
}

// ══════════════════════════════════════════════════
//  v7: ПОЛНЫЙ СБРОС — «стереть всё и начать с чистого листа»
// ══════════════════════════════════════════════════
// РЕШЕНИЕ ПО SYNC ID (ключ localStorage dtree_syncid): ОСТАВЛЯЕМ.
//  • Сброс не будет «фиктивным»: облачную ветку sync/{id}/data мы удаляем сами, поэтому
//    при следующем запуске из облака вернуться нечему. Сам по себе ID — это лишь адрес
//    ветки, а не данные.
//  • Если стереть ID, устройство потеряет связь с другими своими устройствами: они продолжат
//    хранить старые данные и слать их в старую ветку. С сохранённым ID остальные устройства
//    получают чистое состояние (v8: у них нет правок → они принимают чужую ревизию) и тоже обнуляются.
//  • Оговорка: устройство с неотправленными правками (fbDirty) после сброса СЛИЯНИЕМ вернёт свои данные в облако —
//    это свойство синхронизации (правки не теряются), а не сброса.
// ПОРЯДОК: облако (пока жив fbDb) → IndexedDB → localStorage → перезагрузка страницы.
// Перезагрузка нужна намеренно: она гарантированно выбрасывает in-memory состояние S и все
// таймеры, а init() отрабатывает ровно как на чистом устройстве (создаёт демо-дерево).
// Service Worker и его кэш НЕ трогаем — это код приложения, не данные, и офлайн должен работать.
async function fullReset(){
  _resetting=true;      // блокирует persist()/syncToFb() до перезагрузки
  clearTimeout(fbTimer); // отменяем отложенную отправку старого состояния

  // 1. Облако: отписываемся от ветки (чтобы слушатель не среагировал на удаление) и удаляем её.
  //    Если связи нет, remove() не завершится — ждём максимум 4 с. Это не страшно: новое чистое
  //    состояние после перезагрузки всё равно перезапишет ветку (у него свежий lastModified).
  let cloudOk=true;
  if(fbDb&&fbUserPath&&!fbPermDenied){
    try{fbDb.ref(fbUserPath).off();}catch(e){}
    try{
      cloudOk=await Promise.race([
        fbDb.ref(fbUserPath).remove().then(()=>true),
        new Promise(r=>setTimeout(()=>r(false),4000))
      ]);
    }catch(e){cloudOk=false;console.warn('Не удалось очистить облако:',e);}
  }

  // 2. IndexedDB: сначала очищаем хранилище (надёжно), затем пробуем удалить базу целиком.
  if(idb){
    try{
      await new Promise((res,rej)=>{
        const tx=idb.transaction('d','readwrite');
        tx.objectStore('d').clear();
        tx.oncomplete=res;tx.onerror=()=>rej(tx.error);tx.onabort=()=>rej(tx.error);
      });
    }catch(e){console.warn('IDB clear:',e);}
    try{idb.close();}catch(e){}
    idb=null;
    await new Promise(res=>{
      let done=false;const fin=()=>{if(!done){done=true;res();}};
      try{const r=indexedDB.deleteDatabase('DtreeDB');r.onsuccess=r.onerror=r.onblocked=fin;}catch(e){fin();}
      setTimeout(fin,1500); // если другая вкладка держит базу, не ждём вечно — хранилище уже пусто
    });
  }

  // 3. localStorage: оба ключа данных (dtree_syncid намеренно остаётся, см. выше) +
  //    маркер, запрещающий повторный перенос старых данных из FB_LEGACY_PATH.
  try{
    localStorage.removeItem(SKEY);
    localStorage.removeItem(SKEY_LEGACY);
    localStorage.setItem('dtree_nolegacy','1');
    localStorage.removeItem('dtree_dirty');     // v8: метаданные синхронизации тоже стираем
    localStorage.removeItem('dtree_syncbase');
    localStorage.removeItem(CAM_KEY);           // v9 (часть 5): камера — локальная, после сброса тоже по умолчанию
  }catch(e){}

  if(!cloudOk)alert('Не удалось связаться с облаком: локальные данные стёрты, а облачная копия будет заменена чистым состоянием при следующей синхронизации.');

  // 4. Перезагрузка = «первый запуск на чистом устройстве».
  location.reload();
}

function initFirebase(){
  if(!FB_CONFIG.apiKey){return;}// конфиг не заполнен
  try{
    firebase.initializeApp(FB_CONFIG);
    fbDb=firebase.database();

    });

//  AUTO-LAYOUT (dagre)
// ══════════════════════════════════════════════════
document.getElementById('bAuto').addEventListener('click',()=>{
  if(roGuard())return; // v9 (часть 4)
  if(!window.dagre){
    alert('Библиотека авто-раскладки не загружена.\nПроверьте интернет-соединение и перезагрузите страницу.');
    return;
  }
  const nodeIds=Object.keys(S.nodes);
  if(nodeIds.length<2){alert('Нужно хотя бы 2 рамки.');return;}

  const g=new dagre.graphlib.Graph({multigraph:false});
  g.setGraph({rankdir:'TB',nodesep:50,ranksep:70,marginx:80,marginy:80});
  g.setDefaultEdgeLabel(()=>({}));

  // Determine sizes from DOM (or estimate)
  nodeIds.forEach(id=>{
    const el=document.getElementById('nd-'+id);
    const w=el?el.offsetWidth+24:200;
    const h=el?el.offsetHeight+24:100;
    g.setNode(id,{width:w,height:h,label:id});
  });

  S.conns.forEach(c=>{
    if(S.nodes[c.from]&&S.nodes[c.to]&&c.from!==c.to)
      try{g.setEdge(c.from,c.to);}catch(e){}
  });

  dagre.layout(g);

  // Animate: add class, apply positions, remove class after
  nodeIds.forEach(id=>{
    const el=document.getElementById('nd-'+id);
    if(el)el.classList.add('layout-move');
  });

  g.nodes().forEach(id=>{
    const gn=g.node(id);
    if(gn&&S.nodes[id]){
      S.nodes[id].x=Math.round(gn.x-gn.width/2+10);
      S.nodes[id].y=Math.round(gn.y-gn.height/2+10);
      const el=document.getElementById('nd-'+id);
      if(el){el.style.left=S.nodes[id].x+'px';el.style.top=S.nodes[id].y+'px';}
    }
  });
  renderArrows();

  setTimeout(()=>{
    nodeIds.forEach(id=>{
      const el=document.getElementById('nd-'+id);
      if(el)el.classList.remove('layout-move');
    });
  },600);

  persist();
});

// ══════════════════════════════════════════════════
//  SMART PLACEMENT
// ══════════════════════════════════════════════════
function smartPlace(px,py){
  const W=220,H=100,PAD=24;
  const ns=Object.values(S.nodes);
  const ok=(x,y)=>!ns.some(n=>x<n.x+W+PAD&&x+W+PAD>n.x&&y<n.y+H+PAD&&y+H+PAD>n.y);
  if(ok(px,py))return{x:px,y:py};
  for(let r=1;r<=30;r++){
    for(let a=0;a<16;a++){
      const ang=(a/16)*Math.PI*2;
      const x=px+Math.cos(ang)*r*(W+PAD)*0.4;
      const y=py+Math.sin(ang)*r*(H+PAD)*0.4;
      if(ok(x,y))return{x,y};
    }
  }
  return{x:px+260,y:py+120};
}

//  DRAG (MOUSE)
// ══════════════════════════════════════════════════
let dragging=null,panning=null;

function onMD(e,id){
  if(e.button!==0)return;
  const tg=e.target;
  if(tg.tagName==='BUTTON'||tg.tagName==='INPUT'||tg.contentEditable==='true')return;
  if(roMode)return; // v9 (часть 4): просмотр — рамки не таскаем; событие всплывёт до холста и сдвинет камеру
  // FIX v3: handle conn/del modes on desktop
  if(mode==='conn'){e.stopPropagation();connectClick(id);return;}
  if(mode==='del'){e.stopPropagation();if(confirm('Удалить "'+S.nodes[id].text+'"?'))delNode(id);return;}
  e.stopPropagation();
  const n=S.nodes[id],cp=s2c(e.clientX,e.clientY);
  dragging={id,ox:cp.x-n.x,oy:cp.y-n.y};
  document.getElementById('nd-'+id).classList.add('drag');
}

cw.addEventListener('mousedown',e=>{
  if(e.button!==0||dragging)return;
  panning={sx:e.clientX-CAM.x,sy:e.clientY-CAM.y};
});

document.addEventListener('mousemove',e=>{
  if(dragging){
    const cp=s2c(e.clientX,e.clientY);const n=S.nodes[dragging.id];
    n.x=cp.x-dragging.ox;n.y=cp.y-dragging.oy;
    const el=document.getElementById('nd-'+dragging.id);
    if(el){el.style.left=n.x+'px';el.style.top=n.y+'px';}
    renderArrows();
  }else if(panning){
    CAM.x=e.clientX-panning.sx;CAM.y=e.clientY-panning.sy;applyCamera();
  }
});

document.addEventListener('mouseup',()=>{
  if(dragging){document.getElementById('nd-'+dragging.id)?.classList.remove('drag');dragging=null;persist();}
  if(panning){panning=null;saveCam();} // v9 (часть 5): конец перетаскивания камеры — локальное сохранение, не правка данных
});

cw.addEventListener('wheel',e=>{
  e.preventDefault();
  const f=e.deltaY>0?.92:1.08;
  const ns=Math.min(4,Math.max(.15,CAM.scale*f));
  const rect=cw.getBoundingClientRect();
  const mx=e.clientX-rect.left,my=e.clientY-rect.top;
  CAM.x=mx-(mx-CAM.x)*(ns/CAM.scale);
  CAM.y=my-(my-CAM.y)*(ns/CAM.scale);
  CAM.scale=ns;applyCamera();camSaveSoon();
},{passive:false});

// ══════════════════════════════════════════════════
//  DRAG (TOUCH)  — long press 280ms to start drag
// ══════════════════════════════════════════════════
let lpTimer=null,lpId=null,lpTx=0,lpTy=0;
let pinch=null;// {dist, mx, my}
let tapId=null;// for connect/delete tap

function onTS(e,id){
  // FIX v3: if tapping a button/input/editable, let native events handle it — don't start long press
  const tg=e.target;
  if(tg.tagName==='BUTTON'||tg.tagName==='INPUT'||tg.contentEditable==='true'){return;}
  if(roMode)return; // v9 (часть 4): просмотр — долгое нажатие и перетаскивание рамок отключены (камеру двигает общий обработчик ниже)
  e.stopPropagation();
  const t=e.touches[0];
  lpTx=t.clientX;lpTy=t.clientY;
  tapId=id;

  if(mode==='conn'||mode==='del')return;// handle on touchend

  lpId=id;
  lpTimer=setTimeout(()=>{
    lpTimer=null;
    if(navigator.vibrate)navigator.vibrate(35);
    const n=S.nodes[id];const cp=s2c(lpTx,lpTy);
    dragging={id,ox:cp.x-n.x,oy:cp.y-n.y};
    document.getElementById('nd-'+id).classList.add('drag');
  },280);
}

function onTE(e,id){
  // FIX v3: if user tapped a button/input, don't preventDefault — let native click fire
  const tg=e.target;
  if(tg.tagName==='BUTTON'||tg.tagName==='INPUT'){
    if(lpTimer){clearTimeout(lpTimer);lpTimer=null;}
    return;
  }
  e.preventDefault();
  if(lpTimer){clearTimeout(lpTimer);lpTimer=null;}
  if(mode==='conn'){connectClick(id);return;}
  if(mode==='del'){if(confirm('Удалить "'+S.nodes[id].text+'"?'))delNode(id);return;}
}

// Touch move on document (for drag & pan)
document.addEventListener('touchstart',e=>{
  if(e.touches.length===2&&!dragging){
    // Pinch
    if(lpTimer){clearTimeout(lpTimer);lpTimer=null;}
    const t1=e.touches[0],t2=e.touches[1];
    const dx=t1.clientX-t2.clientX,dy=t1.clientY-t2.clientY;
    pinch={dist:Math.sqrt(dx*dx+dy*dy),mx:(t1.clientX+t2.clientX)/2,my:(t1.clientY+t2.clientY)/2};
    panning=null;return;
  }
  if(e.target===cw||e.target===cv||e.target.id==='svg'||e.target.id==='ag'||(roMode&&e.target.closest&&e.target.closest('.node'))){
    const t=e.touches[0];
    panning={sx:t.clientX-CAM.x,sy:t.clientY-CAM.y};
  }
},{passive:true});

document.addEventListener('touchmove',e=>{
  if(e.touches.length===2&&pinch){
    e.preventDefault();
    const t1=e.touches[0],t2=e.touches[1];
    const dx=t1.clientX-t2.clientX,dy=t1.clientY-t2.clientY;
    const newDist=Math.sqrt(dx*dx+dy*dy);
    const f=newDist/pinch.dist;
    const ns=Math.min(5,Math.max(.1,CAM.scale*f));
    const mx=pinch.mx,my=pinch.my-50;
    CAM.x=mx-(mx-CAM.x)*(ns/CAM.scale);
    CAM.y=my-(my-CAM.y)*(ns/CAM.scale);
    CAM.scale=ns;pinch.dist=newDist;applyCamera();camSaveSoon();return;
  }
  const t=e.touches[0];
  if(dragging){
    e.preventDefault();
    // Cancel lpTimer if moved too much
    const dx=t.clientX-lpTx,dy=t.clientY-lpTy;
    lpTx=t.clientX;lpTy=t.clientY;
    const cp=s2c(t.clientX,t.clientY);
    const n=S.nodes[dragging.id];
    n.x=cp.x-dragging.ox;n.y=cp.y-dragging.oy;
    const el=document.getElementById('nd-'+dragging.id);
    if(el){el.style.left=n.x+'px';el.style.top=n.y+'px';}
    renderArrows();
  }else if(panning){
    e.preventDefault();
    // If lpTimer is active and user moved > 8px, cancel it (they're panning)
    if(lpTimer){
      const dx=t.clientX-lpTx,dy=t.clientY-lpTy;
      if(Math.sqrt(dx*dx+dy*dy)>8){clearTimeout(lpTimer);lpTimer=null;lpId=null;}
    }
    CAM.x=t.clientX-panning.sx;CAM.y=t.clientY-panning.sy;applyCamera();
  }
},{passive:false});

document.addEventListener('touchend',e=>{
  pinch=null;
  if(lpTimer){clearTimeout(lpTimer);lpTimer=null;}
  if(dragging){document.getElementById('nd-'+dragging.id)?.classList.remove('drag');dragging=null;persist();}
  if(panning){panning=null;saveCam();} // v9 (часть 5): конец перетаскивания камеры — локальное сохранение, не правка данных
},{passive:true});

let mode='nav';

function setMode(m){
  if(roMode&&m!=='nav'){roGuard();m='nav';} // v9 (часть 4): «стрелка» и «удалить» в режиме просмотра недоступны
  mode=m;
  if(connSrc){document.getElementById('nd-'+connSrc)?.classList.remove('cs');connSrc=null;}
  document.getElementById('bConn').classList.toggle('on',m==='conn');
  document.getElementById('bDel').classList.toggle('on',m==='del');
  const b=document.getElementById('mode-badge');
  const ls={nav:'НАВ',conn:'СТРЕЛКА',del:'УДАЛИТЬ'};
  b.textContent=ls[m];b.className=m==='conn'?'c':m==='del'?'d':'';

function connectClick(id){
  if(!connSrc){
    connSrc=id;document.getElementById('nd-'+id)?.classList.add('cs');
    document.getElementById('mode-badge').textContent='→ ЦЕЛЬ';
  }else{
    if(connSrc!==id&&!S.conns.find(c=>c.from===connSrc&&c.to===id)){
      S.conns.push({id:gid('c'),from:connSrc,to:id});persist();
    }
    document.getElementById('nd-'+connSrc)?.classList.remove('cs');
    connSrc=null;setMode('nav');renderAll();
  }
}

function delNode(id){
  if(roGuard())return; // v9 (часть 4)
  const n=S.nodes[id];if(n?.tableId)delete S.tables[n.tableId];
  delete S.nodes[id];S.conns=S.conns.filter(c=>c.from!==id&&c.to!==id);
  persist();renderAll();
}

// Сводка по архиву таблицы (дни старше TBL_KEEP_DAYS): итоги и по годам — сколько раз выполнялась каждая привычка.
function tableArchiveHtml(tbl){
  const a=tbl.arch;if(!a||!a.total)return '';
  const name=id=>{const tk=(tbl.tasks||[]).find(x=>x.id===id);return tk?tk.name:null;};
  const rows=Object.keys(a.y||{}).sort().reverse().map(y=>{
    const Y=a.y[y];
    const per=Object.keys(Y.t||{}).filter(id=>name(id)).map(id=>escHtml(name(id))+' — '+Y.t[id]).join(', ');
    return `<div style="margin-top:5px"><b>${y}</b>: ${Y.c} отметок в ${Y.d} днях${per?'<br><span style="opacity:.85">'+per+'</span>':''}</div>`;
  }).join('');
  return `<details style="margin:8px 0;font-size:12px;color:var(--txt2)"><summary style="cursor:pointer">📦 Архив (старше ${TBL_KEEP_DAYS} дней): <b>${a.total}</b> отметок · лучшая серия <b>${a.best}</b></summary>${rows}</details>`;
}
function openTable(tid){
  const tbl=S.tables[tid];if(!tbl)return;
  const str=streak(tid);
  const nid=Object.keys(S.nodes).find(id=>S.nodes[id].tableId===tid);
  const total=nid?nodeVal(nid):0;
  const DAYS=TBL_KEEP_DAYS;// 2 года; всё старше уходит в архив (часть 7)
  const dates=[];const now=new Date();
  for(let i=0;i<DAYS;i++){const d=new Date(now);d.setDate(d.getDate()-i);dates.push(localKey(d));}
  // v7 (часть 7): пустые {} на 730 дней больше не создаём (они раздували сохранение) — entries читаются безопасно.

  const todK=todayKey();
  const hh=h=>String(h).padStart(2,'0');
  const cellTitle=m=>m===HFULL?'Отмечены все 24 часа':(m?'Отмечено часов: '+popcnt(m)+' из '+HOURS:'');
  let thead='<th class="dth">Дата</th>';
  tbl.tasks.forEach(tk=>{thead+='<th>'+tk.name+'</th>';});
  let rows='';
  dates.forEach(dk=>{
    const isTd=dk===todK;
    // v7: никаких замочков и блокировок — любой прошлый день можно отметить в любой момент.
    const d=new Date(dk+'T12:00');
    const lbl=d.toLocaleDateString('ru-RU',{day:'numeric',month:'short',year:'numeric',weekday:'short'});
    rows+=`<tr data-dk="${dk}" class="${isTd?'today':''}"><td class="dtd"><button type="button" class="hx" data-x="${dk}" title="Отметить по часам">🕐</button>${lbl}${isTd?' ◀':''}</td>`;
    tbl.tasks.forEach(tk=>{
      const m=cellMask(tbl,dk,tk.id);
      rows+=`<td><input type="checkbox" data-d="${dk}" data-t="${tk.id}" ${m===HFULL?'checked':(m?'data-p="1"':'')} title="${cellTitle(m)}"></td>`;
    });
    rows+='</tr>';
  });

  modal(`
    <h2>📅 <span>${tbl.name}</span></h2>
    <div class="sbar">
      <div><div class="sv" id="tb-str">🔥 ${str}</div><div class="sl">дней подряд</div></div>
      <div class="tv">Всего отмечено:<br><b id="tb-tot">${total}</b> раз</div>
    </div>
    ${tableArchiveHtml(tbl)}
    <div class="hhint">🕐 слева от даты — отметка по часам. Галочка дня ставится сама, когда отмечены все 24 часа, и наоборот: галочка дня отмечает все часы. Если отмечена только часть часов, в клетке видна черта, а значение таблицы не растёт.</div>
    <div class="tscroll"><table><thead><tr>${thead}</tr></thead><tbody>${rows}</tbody></table></div>
    <div class="atrow">
      <input type="text" id="ntkn" placeholder="Название нового столбца…">
      <button id="atk">＋ Столбец</button>
    </div>
    <div class="brow" style="margin-top:12px">
      <button class="mbtn cancel" id="tclose">Закрыть</button>
    </div>`,ov=>{
    const scroll=ov.querySelector('.tscroll');
    // Scroll table to top (today is first row)
    if(scroll)setTimeout(()=>{scroll.scrollTop=0;},50);
    ov.querySelectorAll('input[data-p]').forEach(c=>{c.indeterminate=true;}); // «часть часов» — чёрточка в клетке

    // Таблица может быть заменена целиком (приход данных из облака) — всегда берём актуальный объект.
    const cur=()=>S.tables[tid]||tbl;

    const refreshHead=()=>{
      const a=ov.querySelector('#tb-str'),b=ov.querySelector('#tb-tot');
      if(a)a.textContent='🔥 '+streak(tid);
      if(b)b.textContent=nid&&S.nodes[nid]?nodeVal(nid):0;
    };
    const panelHtml=dk=>{
      const T=cur(),curH=dk===todayKey()?new Date().getHours():-1;
      return T.tasks.map(tk=>{
        const m=cellMask(T,dk,tk.id);
        let b='';
        for(let h=0;h<HOURS;h++){
          b+=`<button type="button" class="hb${((m>>h)&1)?' on':''}${h===curH?' now':''}" data-hd="${dk}" data-ht="${tk.id}" data-h="${h}" title="${hh(h)}:00–${hh((h+1)%24)}:00">${hh(h)}</button>`;
        }
        return `<div class="hgrp"><div class="hgh"><span>${tk.name}</span><b>${popcnt(m)}/${HOURS}</b></div><div class="hgrid">${b}</div></div>`;
      }).join('');
    };
    // Обновляет строку дня (галочки / чёрточки / подсказки) и открытую панель часов этого дня.
    const refreshDay=dk=>{
      const T=cur(),tr=scroll.querySelector(`tr[data-dk="${dk}"]`);if(!tr)return;
      T.tasks.forEach(tk=>{
        const cb=tr.querySelector(`input[data-t="${tk.id}"]`);if(!cb)return;
        const m=cellMask(T,dk,tk.id);
        cb.checked=m===HFULL;cb.indeterminate=m!==0&&m!==HFULL;cb.title=cellTitle(m);
      });
      const nx=tr.nextElementSibling;
      if(nx&&nx.classList.contains('hrow'))nx.querySelector('.hpanel').innerHTML=panelHtml(dk);
    };
    const togglePanel=dk=>{
      const tr=scroll.querySelector(`tr[data-dk="${dk}"]`);if(!tr)return;
      const nx=tr.nextElementSibling;
      if(nx&&nx.classList.contains('hrow')){nx.remove();return;}
      const hr=document.createElement('tr');hr.className='hrow';
      hr.innerHTML='<td colspan="'+(1+cur().tasks.length)+'"><div class="hpanel" style="width:'+Math.max(220,scroll.clientWidth-4)+'px">'+panelHtml(dk)+'</div></td>';
      tr.after(hr);
    };

    // Единая точка изменения ячейки (клик по галочке дня ИЛИ по часу): обе дорожки дают одну маску,
    // поэтому «все часы ⇄ галочка дня» не может разойтись. Значение таблицы меняется только при переходе
    // через границу «день целиком» (nodeVal считает только entries=true).
    const commitCell=(dk,tk,mask)=>{
      if(roGuard()){refreshDay(dk);return;} // v9 (часть 4): ячейка возвращается к сохранённому виду
      const T=cur();mask&=HFULL;
      const prev=cellMask(T,dk,tk);
      if(mask===prev){refreshDay(dk);return;}
      if(popcnt(mask)>popcnt(prev))sfxCheck();
      // v7 (часть 4): считаем, как изменились очки лиги от этой отметки, и сдвигаем историю от дня dk
      // (для прошлого дня это и есть «пересчёт точки именно этого дня»; для сегодня — живая точка).
      const mainId=S.settings.mainNodeId,hasMain=!!(mainId&&S.nodes[mainId]);
      const before=hasMain?Math.round(nodeVal(mainId)):0;
      setCellMask(T,dk,tk,mask);
      shiftHistoryFrom(dk,(hasMain?Math.round(nodeVal(mainId)):0)-before);
      // v9 (часть 2): пересчитываем статус идеальных часов ТОЛЬКО затронутых этой отметкой часов (prev^mask:
      // один час — один бит, галочка дня — все изменившиеся часы), остальные часы и дни не трогаем — история
      // задним числом не переписывается. true = действие пользователя → серия пересчитывается всегда.
      checkAndFixPerfectDay(dk,true,prev^mask);
      persist();renderAll();
      refreshDay(dk);refreshHead();
    };

    scroll.addEventListener('change',e=>{
      const cb=e.target;
      if(!cb.matches||!cb.matches('input[data-d]'))return;
      commitCell(cb.dataset.d,cb.dataset.t,cb.checked?HFULL:0); // галочка дня → все 24 часа (или ни одного)
    });
    scroll.addEventListener('click',e=>{
      const hb=e.target.closest('.hb');
      if(hb){
        const dk=hb.dataset.hd,tk=hb.dataset.ht,h=+hb.dataset.h;
        commitCell(dk,tk,cellMask(cur(),dk,tk)^(1<<h)); // отметка одного часа
        return;
      }
      const hx=e.target.closest('.hx');
      if(hx)togglePanel(hx.dataset.x);
    });
    ov.querySelector('#tclose').onclick=()=>ov.remove();
    ov.querySelector('#atk').onclick=()=>{
      if(roGuard())return; // v9 (часть 4)
      const nm=ov.querySelector('#ntkn').value.trim();if(!nm)return;
      cur().tasks.push({id:gid('tk'),name:nm});persist();ov.remove();openTable(tid);
    };
  });
}

function nodeOpts(sel){
  const opts=Object.values(S.nodes).map(n=>`<option value="${n.id}"${n.id===sel?' selected':''}>${n.text}</option>`).join('');
  return opts||'<option value="">— нет рамок —</option>';
}

  const opts=Object.values(S.tables).map(t=>`<option value="${t.id}"${t.id===sel?' selected':''}>${t.name}</option>`).join('');
  return opts||'<option value="">— нет таблиц —</option>';
}

function achEarned(a){
  try{
    if(a.cond.type==='node')return nodeVal(a.cond.nodeId)>a.cond.threshold;
    if(a.cond.type==='streak')return streak(a.cond.tableId)>a.cond.threshold;
  }catch(e){}
  return false;
}
