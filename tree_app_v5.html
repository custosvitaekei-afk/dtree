// ── Веса редкостей сундуков (v7, часть 5): Обычный 64% / Редкий 26% / Эпический 8% / Легендарный 2% ──
const RARITY_ORDER=['common','rare','epic','legendary'];
const RARITY_WEIGHTS={common:0.64,rare:0.26,epic:0.08,legendary:0.02};
const RARITY_LABEL={common:'Обычный',rare:'Редкий',epic:'Эпический',legendary:'Легендарный'};
/*
  ОБОСНОВАНИЕ ВЕСОВ (часть 5). Пул: 450 эмодзи — 327 обычных, 66 редких, 26 эпических, 31 легендарный.
  Поток сундуков после переделки: шаг 30 очков (≈ 120 сундуков на 3 600 очков в год, это ~10 отметок
  привычек в день) + юбилейные числа (≈ 15 в первый год, потом 1–4 в год) + переходы лиг + стрики
  ≈ 100–250 сундуков в год, типично ~150. Пити-таймера больше нет: легендарные выпадают «честно».
  Ожидаемое число открытий до полной коллекции редкости (задача «собирателя купонов»):
  N ≈ (K / p) × H(K), где K — число эмодзи редкости, p — её вес, H — гармоническое число.
    легендарные: K=31, p=0.02 → 31/0.02 × 4.03 ≈ 6 250 открытий ≈ 40 лет при ~150 в год (≈ 25 лет при
                 250 в год); очередной легендарный в среднем раз в 50 открытий ≈ раз в 4 месяца;
    эпические:   K=26, p=0.08 → ≈ 1 250 открытий ≈ 8 лет;
    редкие:      K=66, p=0.26 → ≈ 1 200 открытий ≈ 8 лет;
    обычные:     K=327, p=0.64 → ≈ 3 250 открытий ≈ 22 года (длинный «хвост» последних повторок).
  Значит, интерес держится десятилетиями, а все легендарные нельзя выбить слишком рано даже при
  очень активной игре. Вес 1% (как было раньше) при новом, более скромном потоке растянул бы сбор
  легендарных на 80+ лет — это уже «никогда», поэтому взято 2%. Если сундуков окажется больше или
  меньше — достаточно поменять RARITY_WEIGHTS: проценты в окне сундуков считаются из них же.
*/

const LEAGUE_NAMES=['Семечко','Росток','Дерево','Камень','Бронза','Серебро','Золото','Платина','Изумруд','Сапфир','Рубин','Аметист','Обсидиан','Адамант','Мифрил','Орихалк','Эфир','Звезда','Галактика','Вселенная','Сингулярность'];
const LEAGUE_ICONS=['🌰','🌱','🌳','🪨','🥉','🥈','🥇','💠','💚','💎','❤️','💜','⚫','🔶','⚙️','🟡','🌫️','⭐','🌌','🪐','♾️'];
const LEAGUE_BASE=100, LEAGUE_GROWTH=1.35; // экспоненциальный рост требуемых очков

function leagueThreshold(level){
  if(level<=0)return 0;
  const raw=LEAGUE_BASE*Math.pow(LEAGUE_GROWTH,level-1);
  const digits=Math.max(0,Math.floor(Math.log10(raw))-1);
  const mag=Math.pow(10,digits);
  return Math.round(raw/mag)*mag;
}
function toRoman(num){
  const vals=[[1000,'M'],[900,'CM'],[500,'D'],[400,'CD'],[100,'C'],[90,'XC'],[50,'L'],[40,'XL'],[10,'X'],[9,'IX'],[5,'V'],[4,'IV'],[1,'I']];
  let res='';for(const [v,s] of vals){while(num>=v){res+=s;num-=v;}}return res||'';
}
function leagueName(level){
  if(level<=0)return LEAGUE_NAMES[0];
  const n=LEAGUE_NAMES.length;
  const cycle=Math.floor(level/n);
  const base=LEAGUE_NAMES[level%n];
  return cycle>0?base+' '+toRoman(cycle+1):base;
}
function leagueIcon(level){return LEAGUE_ICONS[level%LEAGUE_ICONS.length];}
function levelForScore(score){
  let lvl=0;
  while(lvl<300&&leagueThreshold(lvl+1)<=score)lvl++;
  return lvl;
}
function chestsForLevelUp(level){return Math.min(10,1+Math.floor(level/10));}

function ymdAddDays(key,delta){
  const d=new Date(key+'T12:00:00');d.setDate(d.getDate()+delta);return localKey(d);
}
function daysSince(dateKey){
  const start=new Date(dateKey+'T00:00:00');
  const now=new Date(localKey(new Date())+'T00:00:00');
  return Math.floor((now-start)/86400000)+1; // День 1 = день старта
}

//  ИДЕАЛЬНЫЙ ДЕНЬ
// ══════════════════════════════════════════════════
/*
  [v9, часть 2: единица учёта теперь ЧАС — актуальная модель описана ниже, в блоке «МОДЕЛЬ v9». Всё, что в этом
  историческом описании сказано о «днях», относится к часам внутри дня; хранение и пересчёт — как в блоке v9.]
  МОДЕЛЬ (v7, часть 3): день «фиксируется» как идеальный / неидеальный, а не пересчитывается
  по всей истории каждый раз. Храним три вещи в S.game:
    perfectDays   — множество дат, признанных идеальными ({dateKey:true});
    perfectTotal  — сколько их всего (меняется только на +1 / −1 при смене статуса одного дня);
    perfectStreak — текущая серия подряд.
  Статус дня пересчитывается только в трёх случаях:
    1) сегодняшний день — «живой»: при каждом persist() (а значит, при любом изменении галочек
       туда-обратно в течение дня);
    2) догоняющая проверка при запуске (dailyTick → processMissedDay) «закрывает» дни с прошлого визита;
    3) ретроактивная отметка: пользователь поставил / снял галочку на прошлый день — пересчитывается
       только этот один день, ранее зафиксированные дни не трогаются.
  Пропущенные дни отдельно не хранятся: отсутствие даты в perfectDays = «не идеален».
  Серию при открытии приложения после пропуска мы НЕ обнуляем — она остаётся старым значением,
  пока пользователь что-то не отметит (тогда она пересчитывается от сегодня / вчера назад).

  Почему так:
    • O(1) для счётчиков вместо перебора всех таблиц по всем датам на каждом persist();
    • не нужно хранить жизненный цикл таблиц (createdAt / deletedAt): день оценивается по тем
      таблицам, которые существовали в момент фиксации;
    • добавление / удаление таблицы не переписывает историю задним числом — это предсказуемо;
    • если когда-нибудь понадобится явный «пересчёт истории» с учётом новых таблиц — его можно
      добавить отдельной кнопкой в настройках (сейчас не требуется).
  Оговорка: «живой» сегодняшний день оценивается по текущим таблицам, поэтому добавление таблицы
  или столбца сегодня может снять статус «идеален» с сегодняшнего дня (и вернуть, если удалить).
  Ретроактивная отметка прошлого дня тоже оценивает этот день по ТЕКУЩИМ таблицам.
  Множество perfectDays растёт на одну короткую запись в день (~13 байт). Часть 7: дни старше окна таблицы
  (730 дней) вычёркиваются из множества, а серию на границе помнит S.game.perfectArch = {to, tail}
  (см. archivePerfectDays); общий счётчик perfectTotal хранится отдельно и не меняется.
*/

/*
  МОДЕЛЬ v9 (часть 2) — ЕДИНИЦА УЧЁТА ЧАС. Час идеален, если он отмечен у КАЖДОЙ привычки КАЖДОЙ таблицы: идеальные часы
  дня = AND масок всех ячеек (cellMask из части 1), то есть ограничены самой отстающей привычкой; один неотмеченный
  час в любой таблице — час не идеален и серия рвётся. Хранение в S.game (ключи — даты, как раньше):
    perfectDays   {день:true}  — идеальны все 24 часа дня (формат совпадает со старым);
    perfectHrs    {день:маска} — идеальна только часть часов (маска из 24 бит; полная маска сюда не пишется);
    perfectTotal  — идеальных ЧАСОВ за всё время (меняется на разницу числа единичных бит маски дня);
    perfectStreak — серия идеальных часов подряд (пересчитывается из масок, см. calcPerfectStreakFor);
    perfUnit      — 'h' = счётчики в часах; поля нет = старое сохранение в днях (migratePerfect переводит ×24 один раз);
    perfGrace     — {d,m}: разовый «кредит» часов 0…(h−1) дня обновления. До обновления отмечать часы по отдельности
                    было нечем, и без кредита живая серия обнулилась бы сразу; учитывается только в perfectMaskOfDay();
    perfectArch   — {to,tail}: дни ≤ to вычеркнуты из хранилища, tail = серия идеальных часов, заканчивающаяся в 23:00 дня to.
  Что и когда пересчитывается (параметр hmask в checkAndFixPerfectDay):
    • сегодняшний день «живой» — все 24 часа при каждом persist() (в т.ч. заранее отмеченные будущие часы суток);
    • пропущенный день — все 24 часа в догоняющей проверке при запуске (dailyTick → processMissedDay);
    • ретроактивная отметка — ТОЛЬКО затронутые часы (prev^mask ячейки): остальные часы дня и прошлые дни не переписываются.
  Серия: назад от ПОСЛЕДНЕГО идеального часа (не от текущего): неотмеченные часы в конце серию не меняют, рвёт её только
  неотмеченный час между идеальными часами. Если текущий час идеален — вперёд тянется и непрерывная цепочка заранее
  отмеченных идеальных часов до конца суток. Серия сама не «протухает» при долгом отсутствии отметок — она обрывается,
  когда после пропуска появляется новый идеальный час (как и раньше с днями: при открытии после пропуска не обнуляем).
  РЕШЕНИЕ: серия пересчитывается при КАЖДОМ persist(), а не лениво, как было с днями. «Замороженное» значение жило сутки,
  а при часах устаревало бы каждый час и показывало бы уже оборванную серию.
*/
function runDown(m,h){let n=0;while(h>=0&&((m>>h)&1)){n++;h--;}return n;}       // подряд единичных бит ниже h включительно
function runUp(m,h){let n=0;while(h<HOURS&&((m>>h)&1)){n++;h++;}return n;}      // подряд единичных бит выше h включительно
// Маска идеальных часов дня dk из хранилища игры G (полный день = все 24 бита). Не зависит от S — её зовёт и migrate().
function perfMaskIn(G,dk){
  if(G.perfectDays&&G.perfectDays[dk])return HFULL;
  const m=G.perfectHrs&&G.perfectHrs[dk];
  return typeof m==='number'?(m&HFULL):0;
}
function perfectDayMask(dk){return perfMaskIn(S.game,dk);}
// Записывает маску дня в хранилище: полный день → perfectDays, часть → perfectHrs, пусто → ничего. Счётчики не трогает.
function setPerfectMask(dk,mask){
  const G=S.game,H=G.perfectHrs||(G.perfectHrs={});
  mask&=HFULL;
  if(mask===HFULL){G.perfectDays[dk]=true;delete H[dk];}
  else{
    delete G.perfectDays[dk];
    if(mask)H[dk]=mask;else delete H[dk];
  }
}
// Чинит perfectHrs после импорта / слияния устройств: мусор выбрасывается, полная маска → perfectDays,
// пустая → удаляется, день, уже записанный в perfectDays как полный, второй раз не хранится.
function normalizePerfectHrs(G){
  const H=G.perfectHrs;
  if(!H||typeof H!=='object'||Array.isArray(H)){G.perfectHrs={};return;}
  for(const dk of Object.keys(H)){
    const raw=H[dk];
    if(!_DATE_RE.test(dk)||typeof raw!=='number'||!isFinite(raw)||G.perfectDays[dk]){delete H[dk];continue;}
    const m=raw&HFULL;
    if(m===HFULL){G.perfectDays[dk]=true;delete H[dk];}
    else if(m===0)delete H[dk];
    else if(m!==raw)H[dk]=m;
  }
}
// Маска часов дня dk, идеальных по ТЕКУЩИМ таблицам (чистая проверка, состояние не меняет). Привычек нет вообще
// (таблиц нет / все без столбцов) — 0: пустая таблица не даёт «идеальных» часов без единого действия.
function perfectMaskOfDay(dk){
  let m=HFULL,habits=0;
  for(const tid of Object.keys(S.tables)){
    const t=S.tables[tid];
    if(!t.tasks||!t.tasks.length)continue;
    for(const tk of t.tasks){m&=cellMask(t,dk,tk.id);habits++;}
  }
  if(!habits)return 0;
  const g=S.game.perfGrace;
  return g&&g.d===dk?(m|(g.m&HFULL)):m; // разовый кредит часов дня обновления
}
// Приводит идеальные дни / часы к единому виду и ОДИН РАЗ переводит счётчики из дней в часы. Вызывается из migrate()
// — то есть при старте, импорте файла и приходе данных из облака; повторное умножение исключено признаком perfUnit.
function migratePerfect(G){
  delete G.perfectDayDate;
  if(!G.perfectDays||typeof G.perfectDays!=='object'||Array.isArray(G.perfectDays))G.perfectDays={};
  normalizePerfectHrs(G);
  if(G.perfGrace&&(typeof G.perfGrace.d!=='string'||typeof G.perfGrace.m!=='number'))delete G.perfGrace;
  const fromDays=G.perfUnit!=='h';
  if(fromDays){
    // Старое сохранение: идеальный день = 24 идеальных часа. Счётчик и хвост архива умножаются на 24.
    const days=typeof G.perfectTotal==='number'?G.perfectTotal:Object.keys(G.perfectDays).length;
    G.perfectTotal=days*HOURS;
    if(G.perfectArch)G.perfectArch.tail*=HOURS;
    G.perfUnit='h';
    // Серия жива (вчера идеален, сегодня целиком ещё нет): часы 0…(h−1) сегодняшнего дня засчитываются кредитом.
    const today=todayKey(),hr=new Date().getHours();
    if(hr>0&&G.perfectDays[ymdAddDays(today,-1)]&&!G.perfectDays[today])G.perfGrace={d:today,m:(1<<hr)-1};
  }else if(typeof G.perfectTotal!=='number'){
    G.perfectTotal=Object.keys(G.perfectDays).length*HOURS+Object.values(G.perfectHrs).reduce((s,m)=>s+popcnt(m),0);
  }
  if(fromDays||typeof G.perfectStreak!=='number')G.perfectStreak=calcPerfectStreakFor(G);
}

// Старший установленный бит маски (0…23); для пустой маски −1.
function topBit(m){return m?31-Math.clz32(m):-1;}
// Последний день строго раньше day, в котором есть хоть один идеальный час (perfectDays / perfectHrs); нет — null.
function lastPerfDayBefore(G,day){
  const arch=G.perfectArch;let best=null;
  const scan=o=>{for(const k in o){if(k<day&&(!best||k>best)&&(!arch||k>arch.to)&&perfMaskIn(G,k))best=k;}};
  scan(G.perfectDays);scan(G.perfectHrs);
  return best;
}
// Длина серии идеальных ЧАСОВ по хранилищу G (S.game). v9, часть 3 (исправление): серия считается назад от ПОСЛЕДНЕГО
// идеального часа, а не от текущего. Ещё не отмеченные часы в конце (между последним идеальным часом и «сейчас») серию не
// меняют; рвёт её только неотмеченный час МЕЖДУ идеальными часами. Если текущий час идеален — вперёд тянется и непрерывная
// цепочка заранее отмеченных идеальных часов до конца суток (будущие часы, не прилегающие к текущему, не считаются).
// perfectArch = {to,tail}: серия продолжается в архиве (дни ≤ to вычеркнуты); tail — серия, заканчивающаяся в 23:00 дня to.
function calcPerfectStreakFor(G){
  const now=new Date(),today=localKey(now),h=now.getHours(),arch=G.perfectArch;
  const mt=perfMaskIn(G,today),upToNow=mt&((2<<h)-1); // идеальные часы сегодняшнего дня до текущего часа включительно
  let n=0,day=null,top=-1;
  if(upToNow){
    day=today;top=topBit(upToNow);
    if(top===h)n+=runUp(mt,h+1); // текущий час идеален — заранее отмеченные идеальные часы до конца суток тоже в серии
  }else{
    day=lastPerfDayBefore(G,today); // сегодня до текущего часа идеальных нет — ищем последний идеальный час в прошлых днях
    if(day)top=topBit(perfMaskIn(G,day));
  }
  if(!day)return arch?(arch.tail||0):0; // в хранилище идеальных часов нет — остаётся только хвост архива
  for(let g=0;g<40000;g++){
    if(arch&&day<=arch.to){if(day===arch.to)n+=arch.tail||0;break;}
    const r=runDown(perfMaskIn(G,day),top);
    n+=r;
    if(r<=top)break; // цепочка оборвалась внутри дня: неотмеченный час между идеальными
    day=ymdAddDays(day,-1);top=HOURS-1;
  }
  return n;
}
function recalcPerfectStreak(){S.game.perfectStreak=calcPerfectStreakFor(S.game);}

// Фиксирует статус ЧАСОВ одного дня и обновляет perfectDays / perfectHrs / perfectTotal / perfectStreak.
// hmask — какие часы пересчитать (по умолчанию все 24: «живой» сегодняшний день и догоняющая проверка; для
// ретроактивной отметки — только затронутые часы). Остальные часы дня и все остальные дни не трогаются, поэтому
// история задним числом не переписывается. perfectTotal меняется на разницу числа идеальных часов дня.
// userAction=true — вызов из обработчика галочки: серия пересчитывается в любом случае; иначе — если маска дня изменилась
// (при каждом persist() серия дополнительно пересчитывается в recomputeProgress). Возвращает true, если маска дня изменилась.
function checkAndFixPerfectDay(dateKey,userAction,hmask){
  const G=S.game;
  if(dateKey>todayKey())return false; // будущие дни не оцениваем
  if(G.perfectArch&&dateKey<=G.perfectArch.to)return false; // день уже в архиве
  hmask=(hmask===undefined?HFULL:hmask)&HFULL;
  if(!hmask)return false;
  const was=perfectDayMask(dateKey);
  const now=(was&~hmask)|(perfectMaskOfDay(dateKey)&hmask);
  const changed=now!==was;
  if(changed){
    setPerfectMask(dateKey,now);
    G.perfectTotal=Math.max(0,(G.perfectTotal||0)+popcnt(now)-popcnt(was));
  }
  if(changed||userAction)recalcPerfectStreak();
  return changed;
}

// v9 (часть 3): формат счётчиков. Часы → годы / месяцы / недели / дни / часы: 1 дн. = 24 ч, 1 нед. = 7 дн., 1 мес. = 30 дн.,
// 1 г. = 365 дн.; показываются только ненулевые единицы (от старшей к младшей). Месяцев не больше 11 (12×30 < 365 — остаток
// 360…364 дней уходит в недели и дни). В скобках — число ПОЛНЫХ дней без остатка часов (≈ hours/24, вниз).
const PF_UNITS=[['г.',365*24],['мес.',30*24],['нед.',7*24],['дн.',24],['ч',1]];
function fmtPerfectParts(hours){
  hours=Math.max(0,Math.floor(Number(hours)||0));
  let rest=hours;const parts=[];
  PF_UNITS.forEach(([name,size])=>{
    let q=Math.floor(rest/size);
    if(name==='мес.'&&q>11)q=11;
    rest-=q*size;
    if(q>0)parts.push(q.toLocaleString('ru-RU')+'\u00A0'+name); // неразрывный пробел: перенос строки только между единицами
  });
  return {main:parts.length?parts.join(' '):'0\u00A0ч',days:Math.floor(hours/24).toLocaleString('ru-RU')+'\u00A0дн.'};
}
function fmtPerfect(hours){const p=fmtPerfectParts(hours);return p.main+' ('+p.days+')';}
function fmtPerfectHtml(hours){const p=fmtPerfectParts(hours);return p.main+' <span class="pfd">('+p.days+')</span>';}

// Обновляет счётчик в правом верхнем углу главного экрана (читает только сохранённые значения):
// крупно с 🔥 — серия подряд, мелко под ней — всего; подписей нет, только числа в формате fmtPerfect().
function renderPerfectBadge(){
  const st=document.getElementById('pf-streak'),sub=document.getElementById('pf-sub');
  if(!st||!sub||!S.game)return;
  const n=S.game.perfectStreak||0,tot=S.game.perfectTotal||0;
  st.innerHTML='🔥 '+fmtPerfectHtml(n);
  st.classList.toggle('zero',n===0);
  sub.innerHTML=fmtPerfectHtml(tot);
}

// ══════════════════════════════════════════════════
//  КОНКУРЕНТЫ И СЛУЧАЙНЫЕ СОБЫТИЯ
// ══════════════════════════════════════════════════
function pick(arr){return arr[Math.floor(Math.random()*arr.length)];}
function competitorEventText(name,delta){
  const pos=['получил','заработал','выиграл'];
  const neg=['потерял','прокрастинировал и потерял','отвлёкся и упустил'];
  const posReason=['за инновацию','на тренировке','за упорство','на экзамене','за дисциплину'];
  const negReason=['из-за лени','проспав важное','забыв про привычки','на отвлечениях'];
  return delta>=0
    ?'⚔️ '+name+' '+pick(pos)+' +'+delta+' очков '+pick(posReason)
    :'🛑 '+name+' '+pick(neg)+' '+Math.abs(delta)+' очков '+pick(negReason);
}
function rollCompetitorEvents(dateKey){
  if(!S.game.competitors.length)return;
  S.game.competitors.forEach(c=>{
    if(Math.random()<0.5){
      const min=S.settings.eventMin,max=S.settings.eventMax;
      const delta=Math.round(min+Math.random()*(max-min));
      c.eventTotal=(c.eventTotal||0)+delta;
      S.game.eventLog.unshift({date:dateKey,text:competitorEventText(c.name,delta)});
    }
  });
  if(S.game.eventLog.length>150)S.game.eventLog.length=150;
}
function competitorScore(c){
  if(!S.game.startDate)return 0;
  const days=daysSince(S.game.startDate);
  return Math.round(days*c.rate+(c.eventTotal||0));
}

// ══════════════════════════════════════════════════
//  ЕЖЕДНЕВНАЯ ДОГОНЯЮЩАЯ ПРОВЕРКА (запускается 1 раз при старте приложения)
// ══════════════════════════════════════════════════
function processMissedDay(dateKey){
  recomputeHistoryFor(dateKey,false); // v6: догоняющая точка истории (не затирает уже честно записанную)
  checkAndFixPerfectDay(dateKey,false,HFULL); // v9: фиксируем идеальные часы дня (все 24; серия пересчитывается в конце dailyTick)
  rollCompetitorEvents(dateKey);
}
function dailyTick(){
  const today=todayKey();
  if(!S.game.lastDailyCheck){
    // Первый запуск: прошлое "до приложения" не обрабатываем, начинаем со вчера
    S.game.lastDailyCheck=ymdAddDays(today,-1);
    return;
  }
  let cursor=ymdAddDays(S.game.lastDailyCheck,1);
  let guard=0;
  while(cursor<today&&guard<3650){
    processMissedDay(cursor);
    S.game.lastDailyCheck=cursor;
    cursor=ymdAddDays(cursor,1);
    guard++;
  }
  // v9 (часть 2): кредит часов дня обновления отработал (его день закрыт и «запечён» в маску дня) — удаляем;
  // после закрытия пропущенных дней серия пересчитывается: она либо продолжается, либо прерывается на уровне часов.
  if(S.game.perfGrace&&S.game.perfGrace.d<today)delete S.game.perfGrace;
  recalcPerfectStreak();
  compactHistory(); // v7 (часть 4): старые дневные точки сворачиваются в недели / месяцы / годы
}

function grantChest(reason){
  S.game.chests.push({id:gid('chest'),reason});
  if(!reason.startsWith('league:')){ // левел-ап уже даёт свою большую фанфару в showLevelUp
    sfxChest();
    showToast('<span class="fx-chest-emoji">📦</span><div><b>'+chestReasonLabel(reason)+'</b><br>Сундук добавлен в инвентарь</div>',
      {cls:'fx-toast-chest',duration:2000});
  }
}
// Шаг «сундук за очки» и стрик-вехи вынесены в константы — на них опираются и выдача, и окно сундуков.
const CHEST_STEP=30;
const STREAK_MILESTONES=[7,30,90,365];
// Юбилейные / круглые числа очков: 10, 25, 50, 75, затем на каждую декаду (100…1000…10000…) множители
// 1, 1.5, 2, 2.5, 3.5, 5, 7.5 → 100, 150, 200, 250, 350, 500, 750, 1000, 1500 … Интервалы растут вместе с
// очками (шаг всегда ≈ ×1.4–1.5), поэтому в начале сундуков много, а позже они редкие и «весомые».
// Это ОТДЕЛЬНЫЙ триггер от шага в 30 очков: на совпадающих числах (например, 150) выдаются оба сундука.
const JUBILEE_BASE=[10,25,50,75],JUBILEE_MULT=[1,1.5,2,2.5,3.5,5,7.5];
function nextJubilee(v){ // наименьшее юбилейное число строго больше v
  for(const x of JUBILEE_BASE)if(x>v)return x;
  for(let p=100;p<1e15;p*=10)for(const m of JUBILEE_MULT){const x=Math.round(p*m);if(x>v)return x;}
  return Infinity;
}
function escHtml(t){return String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function chestReasonText(reason){
  if(reason.startsWith('league:'))return '🎖 Переход в новую лигу';
  if(reason.startsWith('step:'))return '⭐ Каждые '+CHEST_STEP+' очков: '+reason.split(':')[1];
  if(reason.startsWith('jubilee:'))return '💯 Юбилейное число очков: '+reason.split(':')[1];
  if(reason.startsWith('round:'))return '💯 Круглое число очков: '+reason.split(':')[1]; // сундуки старого формата
  if(reason.startsWith('streak:'))return '🔥 Стрик привычки: '+reason.split(':')[1]+' дней подряд';
  return '📦 Сундук';
}

// ══════════════════════════════════════════════════
//  ЗВУК (Web Audio API, программно, без файлов) — v6, часть 3/3
// ══════════════════════════════════════════════════
/*
  v7 (часть 6): звук переработан. Вместо «8-битных» прямоугольных тонов — мягкие синтезированные
  тембры: у каждой ноты несколько гармоник (колокольчик / пэд) и два слегка расстроенных голоса
  (хорус через detune), экспоненциальные огибающие, общий компрессор и небольшая «комната»
  (реверберация из сгенерированного импульса, без аудиофайлов — приложение остаётся офлайн-автономным).
  Звук играет только после первого жеста пользователя (политика браузеров); если контекст «уснул»,
  перед нотой он будит себя сам (раньше ноты молча терялись).
*/
let _actx=null,_mix=null,_audioUnlocked=false;
function getActx(){
  if(_actx)return _actx;
  try{_actx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){return null;}
  return _actx;
}
// Браузеры не дают звуку играть до первого жеста пользователя — разблокируем при первом
// касании / клике / нажатии клавиши (touchend и click — для старых iOS, где pointerdown не считается жестом).
function unlockAudio(){
  _audioUnlocked=true;
  const ctx=getActx();if(ctx&&ctx.state!=='running')ctx.resume().catch(()=>{});
}
['pointerdown','touchend','click','keydown'].forEach(ev=>document.addEventListener(ev,unlockAudio,{passive:true}));

function soundEnabled(){return S.settings.soundOn!==false;} // настройка «🔊 Звуковые эффекты» гасит ВСЕ sfx*()
// Общая шина: dry → мягкий лимитер → выход; send → свёртка (реверберация) → лимитер.
// ВАЖНО: раньше здесь стоял DynamicsCompressorNode (порог −18 дБ). При проверке в Chromium выяснилось, что он
// «съедает» короткие транзиенты: клик на галочке проседал почти в 4 раза (≈ −30 дБFS) и был едва слышен — даже
// при ratio=1 (то есть дело не в пороге, а во внутреннем упреждении/сглаживании ноды). Поведение компрессора
// к тому же заметно отличается между браузерами (Chrome / Safari / Firefox). Поэтому он заменён на
// детерминированный «мягкий лимитер»: WaveShaper с кривой tanh(x). Малые уровни проходят почти без изменений,
// а пики не могут превысить tanh(1) ≈ 0.76 — клиппинг невозможен даже на плотном аккорде из 60 осцилляторов.
function getMix(ctx){
  if(_mix&&_mix.ctx===ctx)return _mix;
  const lim=ctx.createWaveShaper(),n=2048,curve=new Float32Array(n);
  for(let i=0;i<n;i++)curve[i]=Math.tanh(i/(n-1)*2-1); // вход [−1;1] → tanh
  lim.curve=curve;lim.oversample='2x';lim.connect(ctx.destination);
  const dry=ctx.createGain();dry.gain.value=0.9;dry.connect(lim);
  const len=Math.floor(ctx.sampleRate*1.3),buf=ctx.createBuffer(2,len,ctx.sampleRate);
  for(let c=0;c<2;c++){const d=buf.getChannelData(c);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.6);}
  const conv=ctx.createConvolver();conv.buffer=buf;
  const wet=ctx.createGain();wet.gain.value=0.35;conv.connect(wet);wet.connect(lim);
  return (_mix={ctx,dry,send:conv});
}
// Выполнить fn(ctx), когда аудиоконтекст запущен (будим его при необходимости, но только после жеста).
function withCtx(fn){
  if(!_audioUnlocked)return;
  const ctx=getActx();if(!ctx)return;
  if(ctx.state==='running')fn(ctx);else ctx.resume().then(()=>fn(ctx)).catch(()=>{});
}
// Нота: o.partials — гармоники [[множитель частоты, громкость]], o.detune — расстройка хоруса в центах (0 = один голос),
// o.sus — держать громкость до конца ноты (пэд), иначе плавное затухание (колокольчик), o.wet — доля реверберации, o.lp — lowpass.
function playTone(freq,startAt,dur,o){
  o=o||{};
  withCtx(ctx=>{
    const m=getMix(ctx),t0=ctx.currentTime+startAt;
    const vol=o.vol!=null?o.vol:0.1,atk=o.attack!=null?o.attack:0.008,rel=o.release!=null?o.release:0.25;
    const det=o.detune!=null?o.detune:7,partials=o.partials||[[1,1]];
    const env=ctx.createGain();
    env.gain.setValueAtTime(0.0001,t0);
    env.gain.exponentialRampToValueAtTime(vol,t0+atk);
    if(o.sus)env.gain.setValueAtTime(vol,t0+Math.max(atk,dur-rel));
    env.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
    let out=env;
    if(o.lp){const f=ctx.createBiquadFilter();f.type='lowpass';f.frequency.value=o.lp;env.connect(f);out=f;}
    out.connect(m.dry);
    const send=ctx.createGain();send.gain.value=o.wet!=null?o.wet:0.3;out.connect(send);send.connect(m.send);
    const voices=det?[-det,det]:[0];
    partials.forEach(pp=>voices.forEach(dc=>{
      const osc=ctx.createOscillator(),g=ctx.createGain();
      osc.type=o.type||'sine';osc.frequency.setValueAtTime(freq*pp[0],t0);osc.detune.value=dc;
      g.gain.value=pp[1]/voices.length;
      osc.connect(g);g.connect(env);osc.start(t0);osc.stop(t0+dur+0.05);
    }));
  });
}
// «Шорох» — шум через полосовой фильтр с ползущей частотой (скрип крышки сундука).
function playSweep(startAt,dur,f0,f1,vol){
  withCtx(ctx=>{
    const m=getMix(ctx),t0=ctx.currentTime+startAt,n=Math.floor(ctx.sampleRate*dur);
    const buf=ctx.createBuffer(1,n,ctx.sampleRate),d=buf.getChannelData(0);
    for(let i=0;i<n;i++)d[i]=Math.random()*2-1;
    const src=ctx.createBufferSource();src.buffer=buf;
    const bp=ctx.createBiquadFilter();bp.type='bandpass';bp.Q.value=2.2;
    bp.frequency.setValueAtTime(f0,t0);bp.frequency.exponentialRampToValueAtTime(f1,t0+dur);
    const g=ctx.createGain();
    g.gain.setValueAtTime(0.0001,t0);g.gain.exponentialRampToValueAtTime(vol,t0+dur*0.85);g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
    src.connect(bp);bp.connect(g);g.connect(m.dry);src.start(t0);
  });
}
const SND_BELL=[[1,1],[2.01,0.3],[3.02,0.1]]; // стеклянный колокольчик (чуть негармоничные обертоны)
const SND_PAD=[[1,1],[2,0.3]];                // мягкий пэд
// Иерархия громкости (пик после лимитера, проверено офлайн-рендером): галочка ≈ 0.13 < сундук ≈ 0.2 <
// открытие сундука / новая лига ≈ 0.4 — частый звук самый тихий, редкие события — самые заметные.
// Галочка (в таблицах И в обычных рамках): тихий стеклянный «тик»; высота случайно из пентатоники,
// чтобы частые клики не надоедали.
function sfxCheck(){
  if(!soundEnabled())return;
  const f=[784,880,988,1175][Math.floor(Math.random()*4)];
  playTone(f,0,0.26,{partials:SND_BELL,vol:0.13,attack:0.004,detune:4,wet:0.2});
}
// Сундук получен: быстрое восходящее арпеджио до-ми-соль-до.
// Троттлинг: при большом скачке очков (массовая отметка, импорт) за один пересчёт может выдаться 5–10 сундуков
// сразу — без ограничения они давали 10 наложенных арпеджио (≈ 200 осцилляторов) и звучали как каша.
// Теперь повторный вызов в течение 600 мс молчит (тосты при этом показываются как раньше).
let _lastChestSfx=-1e9;
function sfxChest(){
  if(!soundEnabled())return;
  const now=performance.now();if(now-_lastChestSfx<600)return;_lastChestSfx=now;
  [523.25,659.25,783.99,1046.5].forEach((f,i)=>playTone(f,i*0.07,0.42,{partials:SND_BELL,vol:0.15,attack:0.005,wet:0.35}));
}
// Сундук ОТКРЫТ: шорох во время тряски (650 мс до появления награды) → тёплый бас и аккорд на раскрытии →
// искры. Чем реже предмет, тем торжественнее: больше искр, дольше звучит аккорд, больше «зала» (реверберации);
// у эпического и легендарного добавляется светлая октава сверху (shimmer).
const SND_OPEN={
  common:   {sparks:0,dur:1.0,wet:0.40,shimmer:false},
  rare:     {sparks:2,dur:1.2,wet:0.45,shimmer:false},
  epic:     {sparks:4,dur:1.5,wet:0.50,shimmer:true},
  legendary:{sparks:7,dur:2.0,wet:0.60,shimmer:true}
};
function sfxChestOpen(rarity){
  if(!soundEnabled())return;
  const c=SND_OPEN[rarity]||SND_OPEN.common;
  playSweep(0,0.6,260,2200,0.35);
  playTone(130.81,0.62,c.dur,{type:'triangle',partials:[[1,1],[2,0.35]],vol:0.16,attack:0.02,sus:1,release:c.dur*0.55,wet:0.3});
  [523.25,659.25,783.99,1046.5].forEach((f,i)=>playTone(f,0.65+i*0.03,c.dur+0.2,{type:'triangle',partials:SND_PAD,vol:0.09,attack:0.02,sus:1,release:c.dur*0.6,wet:c.wet}));
  if(c.shimmer)[2093,2637].forEach((f,i)=>playTone(f,0.7+i*0.05,c.dur+0.4,{partials:SND_BELL,vol:0.05,attack:0.03,sus:1,release:c.dur*0.7,wet:0.7}));
  const spark=[1318.5,1568,1760,2093,2349.3,2637,3136];
  for(let i=0;i<c.sparks;i++)playTone(spark[i],0.8+i*0.08,0.5,{partials:SND_BELL,vol:0.08,attack:0.004,wet:0.4});
}
// Новая лига: торжественное восхождение и долгий светлый аккорд.
function sfxLeague(){
  if(!soundEnabled())return;
  [523.25,659.25,783.99,1046.5,1318.5].forEach((f,i)=>playTone(f,i*0.12,0.7,{type:'triangle',partials:SND_PAD,vol:0.16,attack:0.01,sus:1,release:0.4,wet:0.4}));
  [261.63,523.25,783.99,1046.5,1318.5].forEach(f=>playTone(f,0.62,1.6,{type:'triangle',partials:SND_PAD,vol:0.12,attack:0.03,sus:1,release:1.0,wet:0.5}));

function chestReasonLabel(reason){

function showLevelUp(level,chestCount){
  const ov=document.getElementById('levelup-ov');
  document.getElementById('lu-icon').textContent=leagueIcon(level);
  document.getElementById('lu-title').textContent='Новая лига: '+leagueName(level)+'!';
  document.getElementById('lu-sub').textContent='Получено сундуков: '+chestCount;
  ov.classList.add('show');
  sfxLeague();
  let rays=null;
  if(fxEnabled()){
    spawnConfetti(ov);
    rays=document.createElement('div');rays.className='lu-rays';
    ov.insertBefore(rays,ov.firstChild);
  }
  document.getElementById('lu-close').onclick=()=>{
    ov.classList.remove('show');

    if(rays)rays.remove();
  };
}


// ══════════════════════════════════════════════════
//  ИСТОРИЯ ОЧКОВ (для статистики)
// ══════════════════════════════════════════════════
/*
  ХРАНЕНИЕ (v7, часть 4): S.game.history не растёт бесконечно. Значение точки — очки лиги на КОНЕЦ
  периода (как цена закрытия на бирже), слои от свежих к старым:
    d — по дням    {YYYY-MM-DD: score}  последние HIST_DAY_KEEP дней (≈ 13 мес.);
    w — по неделям {понедельник: score} до HIST_WEEK_KEEP дней назад (≈ 5 лет);
    m — по месяцам {YYYY-MM: score}     до HIST_MONTH_KEEP дней назад (≈ 20 лет);
    y — по годам   {YYYY: score}        всё, что старше.
  Всего ≈ 400 + 260 + 180 + N записей — размер ограничен.
  fz — скаляры уже свёрнутых дней: max (максимум дневной дельты), sum (сумма дельт), cnt (число дельт),
  last / ld (очки и дата последнего свёрнутого дня). При сворачивании пик дня попадает в fz.max ДО
  того, как день «размажется» по неделе. Максимум и среднее за всё время = fz + точные дневные точки
  (см. historyStats): среднее = running_sum / count, максимум обновляется при появлении нового.
  Почему не один голый скаляр: день с галочкой задним числом меняет дельту и вниз тоже, а откатить
  максимум без данных нельзя — поэтому для последних ~13 месяцев берём точные дни.
*/
const HIST_DAY_KEEP=400,HIST_WEEK_KEEP=1825,HIST_MONTH_KEEP=7300;

// Пересчитывает и сохраняет очки лиги (значение главной рамки) в слое дней для dateKey.
// forceOverwrite=true — для «сегодня» (значение живое, меняется в течение дня);
// forceOverwrite=false — при догоняющей проверке, чтобы не затирать уже честно записанное значение.
function recomputeHistoryFor(dateKey,forceOverwrite){
  const mainId=S.settings.mainNodeId;
  if(!mainId||!S.nodes[mainId])return;
  const h=S.game.history;
  if(dateKey<ymdAddDays(todayKey(),-HIST_DAY_KEEP))return; // день уже в свёрнутом слое — дневную точку не воскрешаем
  if(!forceOverwrite&&h.d[dateKey]!==undefined)return;
  h.d[dateKey]=Math.round(nodeVal(mainId));
}

// Сворачивает слои: дни → недели → месяцы → годы. Идемпотентна, вызывается из dailyTick().
function compactHistory(){
  const h=S.game.history,fz=h.fz,today=todayKey();
  const cutD=ymdAddDays(today,-HIST_DAY_KEEP);
  Object.keys(h.d).sort().forEach(k=>{
    if(k>=cutD)return;
    const sc=h.d[k];
    if(fz.last!==null){ // дельта этого дня относительно предыдущего свёрнутого → в скаляры
      const dl=sc-fz.last;
      if(fz.max===null||dl>fz.max)fz.max=dl;
      fz.sum+=dl;fz.cnt++;
    }
    fz.last=sc;fz.ld=k;
    h.w[bucketKey(k,'week')]=sc; // ключи идут по возрастанию даты → в неделе остаётся последнее значение
    delete h.d[k];
  });
  const cutW=ymdAddDays(today,-HIST_WEEK_KEEP);
  Object.keys(h.w).sort().forEach(k=>{if(k<cutW){h.m[bucketKey(k,'month')]=h.w[k];delete h.w[k];}});
  const cutM=ymdAddDays(today,-HIST_MONTH_KEEP).slice(0,7);
  Object.keys(h.m).sort().forEach(k=>{if(k<cutM){h.y[k.slice(0,4)]=h.m[k];delete h.m[k];}});
}

// Ретроактивная отметка: очки лиги на КОНЕЦ дня dateKey и всех следующих дней меняются на diff
// (отметка считается во всех значениях, начиная с её дня). Сегодняшнюю точку не трогаем — она живая.
// Для уже свёрнутых дней максимум fz.max не пересчитываем (день-носитель пика неизвестен) — это
// редкий случай отметки старше ~13 месяцев.
function shiftHistoryFrom(dateKey,diff){
  if(!diff||dateKey>=todayKey())return;
  const h=S.game.history,fz=h.fz;
  const add=(o,from)=>Object.keys(o).forEach(k=>{if(k>=from)o[k]+=diff;});
  add(h.d,dateKey);add(h.w,bucketKey(dateKey,'week'));add(h.m,bucketKey(dateKey,'month'));add(h.y,bucketKey(dateKey,'year'));
  if(fz.ld!==null&&dateKey<=fz.ld){fz.last+=diff;fz.sum+=diff;}
}

// Максимум и среднее дневного прироста очков за всё время: скаляры свёрнутой части + точные дни.
function historyStats(){
  const h=S.game.history,fz=h.fz;
  let max=fz.max,sum=fz.sum,cnt=fz.cnt,prev=fz.last;
  Object.keys(h.d).sort().forEach(k=>{
    const sc=h.d[k];
    if(prev!==null){const dl=sc-prev;if(max===null||dl>max)max=dl;sum+=dl;cnt++;}
    prev=sc;
  });
  return {max:max===null?0:max,avg:cnt?sum/cnt:0,cnt};
}

// Отсортированный по дате массив [{date,score}] — все слои в одном ряду. Даты сжатых точек —
// конец периода, но не позже дня перед началом более свежего слоя (чтобы ряд строго возрастал).
function getHistoryPoints(){
  const h=S.game.history;
  const endOf={
    w:k=>ymdAddDays(k,6),
    m:k=>{const p=k.split('-');return localKey(new Date(+p[0],+p[1],0));},
    y:k=>k+'-12-31'
  };
  const fresh=Object.keys(h.d).sort().map(date=>({date,score:h.d[date]}));
  let limit=fresh.length?fresh[0].date:ymdAddDays(todayKey(),1);
  const older=[]; // от новых к старым
  ['w','m','y'].forEach(t=>{
    Object.keys(h[t]).sort().reverse().forEach(k=>{
      let d=endOf[t](k);
      if(d>=limit)d=ymdAddDays(limit,-1);
      older.push({date:d,score:h[t][k]});limit=d;
    });
  });
  return older.reverse().concat(fresh);
}

// ══════════════════════════════════════════════════
//  ОСНОВНОЙ ХУК ПРОГРЕССА (вызывается из persist())
// ══════════════════════════════════════════════════
function recomputeProgress(){
  let changed=false;
  const mainId=S.settings.mainNodeId;
  if(mainId&&S.nodes[mainId]){
    const curScore=nodeVal(mainId);
    recomputeHistoryFor(todayKey(),true); // v6: живая точка "сегодня" в историю очков
    const lvl=levelForScore(curScore);
    if(lvl>S.game.lastLeagueLevel){
      const n=chestsForLevelUp(lvl);
      for(let i=0;i<n;i++)grantChest('league:'+lvl);
      S.game.lastLeagueLevel=lvl;changed=true;
      showLevelUp(lvl,n);
    }
    // Триггер 1: каждые CHEST_STEP очков — сундук. Порог только растёт (high-water mark): если очки упали
    // (сняли галочки) и снова выросли, повторной выдачи нет.
    let guard=0;
    while(curScore-S.game.grantedStepScore>=CHEST_STEP&&guard<1000){
      S.game.grantedStepScore+=CHEST_STEP;grantChest('step:'+S.game.grantedStepScore);
      changed=true;guard++;
    }
    // Триггер 2 (отдельный): попадание в юбилейное / круглое число — ровно один сундук за число.
    guard=0;
    for(let nx=nextJubilee(S.game.grantedJubilee);curScore>=nx&&guard<100;nx=nextJubilee(S.game.grantedJubilee),guard++){
      S.game.grantedJubilee=nx;grantChest('jubilee:'+nx);changed=true;
    }
  }
  const milestones=STREAK_MILESTONES;
  Object.keys(S.tables).forEach(tid=>{
    const str=streak(tid);
    if(!S.game.grantedStreaks[tid])S.game.grantedStreaks[tid]=[];
    milestones.forEach(m=>{
      if(str>=m&&!S.game.grantedStreaks[tid].includes(m)){
        S.game.grantedStreaks[tid].push(m);grantChest('streak:'+m);changed=true;
      }
    });
  });
  // v9: сегодняшний день «живой» — оцениваем при каждом persist() все 24 часа (в т.ч. заранее отмеченные будущие
  // часы суток); прошлые дни здесь не трогаем. Серия в часах «стареет» с каждым часом — пересчитываем при каждом сохранении.
  if(checkAndFixPerfectDay(todayKey(),false,HFULL))changed=true;
  recalcPerfectStreak();
  renderLeagueBar();
  return changed;
}

// ══════════════════════════════════════════════════
//  СТАТИСТИКА (v6, часть 2/3)
// ══════════════════════════════════════════════════
const CHART_POINT_GAP=46;   // px между точками на графиках статистики
const CHART_H=230;          // общая высота SVG графика
const CHART_TOP=26,CHART_BOT=40,CHART_L=16,CHART_R=16;
const CHART_RECENT_DAYS=45; // сколько последних дней показываем поточечно (не агрегируя)
const MONTH_SHORT=['янв','фев','мар','апр','май','июн','июл','авг','сен','окт','ноя','дек'];

function shortDateLabel(dateKey){
  const d=new Date(dateKey+'T12:00:00');
  return d.toLocaleDateString('ru-RU',{day:'numeric',month:'short'});
}
function bucketKey(dateKey,granularity){
  const d=new Date(dateKey+'T12:00:00');
  if(granularity==='year')return String(d.getFullYear());
  if(granularity==='month')return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
  const dow=(d.getDay()+6)%7; // 0=понедельник — начало недели
  const monday=new Date(d);monday.setDate(d.getDate()-dow);
  return localKey(monday);
}
function bucketLabel(key,granularity){
  if(granularity==='year')return key;
  if(granularity==='month'){
    const parts=key.split('-');
    return MONTH_SHORT[parseInt(parts[1],10)-1]+' '+parts[0];
  }
  return shortDateLabel(key); // неделя подписывается датой её понедельника
}
// v6: последние recentDays дней — по дням; всё, что старше — агрегируется по неделям
// (до ~4 месяцев), затем по месяцам (до ~2 лет), затем по годам. Это держит график
// читаемым при любом объёме истории (само хранилище сворачивается отдельно — compactHistory()).
function aggregateForChart(points,recentDays){
  if(!points.length)return [];
  const cutoff=ymdAddDays(todayKey(),-recentDays);
  const older=points.filter(p=>p.date<cutoff);
  const recent=points.filter(p=>p.date>=cutoff);
  let out=[];
  if(older.length){
    const spanDays=Math.round((new Date(older[older.length-1].date+'T12:00:00')-new Date(older[0].date+'T12:00:00'))/86400000);
    let granularity='week';
    if(spanDays>730)granularity='year';
    else if(spanDays>120)granularity='month';
    const buckets={};
    older.forEach(p=>{
      const key=bucketKey(p.date,granularity);
      if(!buckets[key])buckets[key]={scores:[],dates:[]};
      buckets[key].scores.push(p.score);buckets[key].dates.push(p.date);
    });
    out=Object.keys(buckets).sort().map(key=>{
      const b=buckets[key];
      return {date:b.dates[b.dates.length-1],score:b.scores[b.scores.length-1],label:bucketLabel(key,granularity),n:b.scores.length,agg:true};
    });
  }
  return out.concat(recent.map(p=>({date:p.date,score:p.score,label:shortDateLabel(p.date),n:1,agg:false})));
}
// Дельты между соседними (возможно агрегированными) точками графика роста очков.
// Для агрегированной точки (неделя / месяц / год) значение = РОСТ ЗА ПЕРИОД / ЧИСЛО ДНЕЙ, то есть
// средний прирост за день внутри периода: так столбцы остаются сравнимыми с пунктирными линиями
// «максимум за день» и «среднее за день» (иначе недельная сумма всегда «перепрыгивала» бы максимум).
function buildDeltaSeries(aggPoints){
  const out=[];
  for(let i=1;i<aggPoints.length;i++){
    const a=aggPoints[i-1],b=aggPoints[i];
    const days=Math.max(1,Math.round((new Date(b.date+'T12:00:00')-new Date(a.date+'T12:00:00'))/86400000));
    out.push({date:b.date,label:b.label,value:(b.score-a.score)/days,agg:b.agg});
  }
  return out;
}

// ── SVG-графики (без внешних библиотек, чтобы не раздувать офлайн-кэш) ──
function svgLineChart(points,opts){
  opts=opts||{};
  const n=points.length;
  if(n<2)return '<div class="chart-empty">Пока недостаточно данных для этого графика.</div>';
  const w=Math.max(560,(n-1)*CHART_POINT_GAP+CHART_L+CHART_R+40);
  const plotH=CHART_H-CHART_TOP-CHART_BOT;
  const vals=points.map(p=>p.value);
  let minV=Math.min(...vals),maxV=Math.max(...vals);
  if(opts.extraLine!=null){minV=Math.min(minV,opts.extraLine);maxV=Math.max(maxV,opts.extraLine);}
  if(opts.zeroLine){minV=Math.min(minV,0);maxV=Math.max(maxV,0);}
  if(minV===maxV){minV-=1;maxV+=1;}
  const range=maxV-minV;
  minV-=range*0.1;maxV+=range*(opts.extraLine!=null?0.18:0.14);
  const xOf=i=>CHART_L+34+i*CHART_POINT_GAP;
  const yOf=v=>CHART_TOP+plotH-((v-minV)/(maxV-minV))*plotH;
  const fmt=opts.fmt||(v=>Math.round(v).toLocaleString('ru-RU'));
  let path='';
  points.forEach((p,i)=>{path+=(i===0?'M':'L')+xOf(i).toFixed(1)+' '+yOf(p.value).toFixed(1)+' ';});
  let dots='',labels='',dateLabels='';
  points.forEach((p,i)=>{
    const px=xOf(i),py=yOf(p.value);
    const col=opts.colorFn?opts.colorFn(p.value):(opts.color||'var(--acc)');
    dots+=`<circle cx="${px.toFixed(1)}" cy="${py.toFixed(1)}" r="3.2" fill="${col}"/>`;
    labels+=`<text x="${px.toFixed(1)}" y="${(py-9).toFixed(1)}" class="chpt-val" fill="${col}" text-anchor="middle">${fmt(p.value)}</text>`;
    dateLabels+=`<text x="${px.toFixed(1)}" y="${CHART_H-12}" class="chpt-date" fill="var(--txt2)" text-anchor="middle">${p.label}${p.agg?' *':''}</text>`;
  });
  const extraLineSvg=opts.extraLine!=null?`<line x1="${CHART_L}" y1="${yOf(opts.extraLine).toFixed(1)}" x2="${w-CHART_R}" y2="${yOf(opts.extraLine).toFixed(1)}" class="chart-nextline"/>`:'';
  const zeroSvg=opts.zeroLine?`<line x1="${CHART_L}" y1="${yOf(0).toFixed(1)}" x2="${w-CHART_R}" y2="${yOf(0).toFixed(1)}" class="chart-zeroline"/>`:'';
  return `<svg viewBox="0 0 ${w} ${CHART_H}" width="${w}" height="${CHART_H}" class="statchart" preserveAspectRatio="xMinYMid meet">
    ${zeroSvg}${extraLineSvg}
    <path d="${path.trim()}" fill="none" stroke="${opts.color||'var(--acc)'}" stroke-width="2"/>
    ${dots}${labels}${dateLabels}
  </svg>`;
}
function svgBarChart(points,opts){
  opts=opts||{};
  const n=points.length;
  if(!n)return '<div class="chart-empty">Пока недостаточно данных для этого графика.</div>';
  const w=Math.max(560,n*CHART_POINT_GAP+CHART_L+CHART_R+20);
  const plotH=CHART_H-CHART_TOP-CHART_BOT;
  const vals=points.map(p=>p.value);
  let minV=Math.min(0,...vals),maxV=Math.max(0,...vals);
  (opts.hLines||[]).forEach(l=>{minV=Math.min(minV,l.v);maxV=Math.max(maxV,l.v);}); // пунктирные линии всегда в кадре
  if(minV===maxV){minV-=1;maxV+=1;}
  const range=maxV-minV;
  minV-=range*0.08;maxV+=range*0.16;
  const xOf=i=>CHART_L+34+i*CHART_POINT_GAP;
  const yOf=v=>CHART_TOP+plotH-((v-minV)/(maxV-minV))*plotH;
  const y0=yOf(0);
  // Пунктирные горизонтальные линии (максимум / среднее) с подписью у правого края:
  // первая подпись над линией, вторая под ней, чтобы не налезали друг на друга.
  const hSvg=(opts.hLines||[]).map((l,i)=>{
    const y=yOf(l.v);
    return `<line x1="${CHART_L}" y1="${y.toFixed(1)}" x2="${w-CHART_R}" y2="${y.toFixed(1)}" stroke="${l.col}" stroke-width="1.5" stroke-dasharray="6,4"/>`+
      `<text x="${w-CHART_R-2}" y="${(i===0?y-4:y+12).toFixed(1)}" class="chpt-val" fill="${l.col}" text-anchor="end">${l.label}</text>`;
  }).join('');
  const fmt=opts.fmt||(v=>(v>0?'+':'')+Math.round(v).toLocaleString('ru-RU'));
  const barW=Math.min(28,CHART_POINT_GAP-10);
  let bars='',labels='',dateLabels='';
  points.forEach((p,i)=>{
    const px=xOf(i),py=yOf(p.value);
    const top=Math.min(y0,py),h=Math.max(1,Math.abs(py-y0));
    const col=p.value>=0?'var(--grn)':'var(--red)';
    bars+=`<rect x="${(px-barW/2).toFixed(1)}" y="${top.toFixed(1)}" width="${barW}" height="${h.toFixed(1)}" fill="${col}" rx="2"/>`;
    const labY=p.value>=0?(top-5):(top+h+13);
    labels+=`<text x="${px.toFixed(1)}" y="${labY.toFixed(1)}" class="chpt-val" fill="${col}" text-anchor="middle">${fmt(p.value)}</text>`;
    dateLabels+=`<text x="${px.toFixed(1)}" y="${CHART_H-12}" class="chpt-date" fill="var(--txt2)" text-anchor="middle">${p.label}${p.agg?' *':''}</text>`;
  });
  return `<svg viewBox="0 0 ${w} ${CHART_H}" width="${w}" height="${CHART_H}" class="statchart" preserveAspectRatio="xMinYMid meet">
    <line x1="${CHART_L}" y1="${y0.toFixed(1)}" x2="${w-CHART_R}" y2="${y0.toFixed(1)}" class="chart-zeroline"/>
    ${hSvg}${bars}${labels}${dateLabels}
  </svg>`;
}

/*
  ПОЛНОЭКРАННЫЙ РЕЖИМ ГРАФИКОВ (v7, часть 4б). Весь выбранный диапазон вписывается в ширину экрана,
  горизонтального скролла нет. Порядок такой:
    1) окно = последние N дней (или от первой точки для «Всё время»), заканчивается сегодняшним днём;
    2) шаг точки выбирается по длине окна: до 100 дн. — день, до 400 — неделя, до 2000 — месяц,
       до 7400 — квартал, дальше — год (всегда 40–100 столбцов/точек, читается на телефоне);
    3) значение точки = очки на конец периода («последняя известная точка не позже конца периода»),
       поэтому грубые слои хранилища (недели / месяцы / годы) не искажают картину;
    4) где данных ещё нет (окно начинается раньше первой записи) — серая зона «нет данных».
  Столбец Δ = средний прирост за день внутри периода (как в окне статистики), чтобы он был
  сопоставим с пунктирными линиями «максимум» и «среднее» за день.
*/
const FS_SCALES=[['1w','1 нед',7],['2w','2 нед',14],['1m','1 мес',30],['3m','3 мес',91],['6m','6 мес',182],
  ['1y','1 год',365],['5y','5 лет',1826],['10y','10 лет',3652],['20y','20 лет',7305],['all','Всё время',0]];
const FS_GRAN_NAME={day:'день',week:'неделя',month:'месяц',quarter:'квартал',year:'год'};
let _fsScale='1m',_fsType='score'; // выбранный масштаб запоминается между открытиями

function fmtDelta(v){return (v>0?'+':'')+(Math.round(v*10)/10).toLocaleString('ru-RU');} // одна цифра после запятой, если нужна
function fsNum(v){const a=Math.abs(v);return a>=1e6?(v/1e6).toFixed(1)+'M':a>=1e4?Math.round(v/1e3)+'k':Math.round(v).toLocaleString('ru-RU');}
function fsKey(date,g){
  if(g==='day')return date;
  if(g==='quarter')return date.slice(0,4)+'-Q'+(Math.floor((+date.slice(5,7)-1)/3)+1);
  return bucketKey(date,g);
}
function fsLabel(key,g){
  if(g==='day'||g==='week')return shortDateLabel(key);
  if(g==='month')return bucketLabel(key,'month');
  if(g==='quarter')return key.slice(5)+' '+key.slice(2,4); // «Q2 26»
  return key;
}
// Ряд точек для масштаба: [{key,label,end,value,delta}], value/delta = null там, где данных нет.
function fsSeries(scaleKey){
  const pts=getHistoryPoints(),today=todayKey();
  const sc=FS_SCALES.find(x=>x[0]===scaleKey)||FS_SCALES[2];
  const start=sc[2]?ymdAddDays(today,1-sc[2]):(pts.length?pts[0].date:ymdAddDays(today,-6));
  const gap=(a,b)=>Math.round((new Date(b+'T12:00:00')-new Date(a+'T12:00:00'))/86400000);
  const days=gap(start,today)+1;
  const g=days<=100?'day':days<=400?'week':days<=2000?'month':days<=7400?'quarter':'year';
  const bs=[];let cur=null;
  for(let d=start,i=0;d<=today&&i<20000;d=ymdAddDays(d,1),i++){
    const k=fsKey(d,g);
    if(!cur||cur.key!==k){cur={key:k,label:fsLabel(k,g),end:d};bs.push(cur);}
    cur.end=d;
  }
  let j=0,last=null;
  const valAt=date=>{while(j<pts.length&&pts[j].date<=date){last=pts[j].score;j++;}return last;}; // вызывается по возрастанию дат
  let prevEnd=ymdAddDays(start,-1),prevV=valAt(prevEnd);
  bs.forEach(b=>{
    b.value=valAt(b.end);
    b.delta=(b.value!==null&&prevV!==null)?(b.value-prevV)/Math.max(1,gap(prevEnd,b.end)):null;
    prevV=b.value;prevEnd=b.end;
  });
  return {buckets:bs,gran:g};
}
// SVG, вписанный в w×h: type 'score' — линия, 'delta' — столбцы; opts: {fmt, hLines:[{v,col,label}]}.
function svgFitChart(type,bs,w,h,opts){
  opts=opts||{};
  const L=46,R=12,T=14,B=28,pw=w-L-R,ph=h-T-B,n=bs.length,key=type==='delta'?'delta':'value';
  const vals=bs.map(b=>b[key]).filter(v=>v!==null);
  if(!vals.length)return '<div class="chart-empty">Нет данных за выбранный период.</div>';
  let mn=Math.min(...vals),mx=Math.max(...vals);
  if(type==='delta'){mn=Math.min(mn,0);mx=Math.max(mx,0);}
  (opts.hLines||[]).forEach(l=>{mn=Math.min(mn,l.v);mx=Math.max(mx,l.v);});
  if(mn===mx){mn-=1;mx+=1;}
  const pad=(mx-mn)*0.08;mn-=pad;mx+=pad;
  const slot=pw/n,xOf=i=>L+slot*(i+0.5),yOf=v=>T+ph-((v-mn)/(mx-mn))*ph;
  let o=`<svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" class="statchart">`;
  for(let t=0;t<=4;t++){ // сетка и подписи оси Y
    const v=mn+(mx-mn)*t/4,y=yOf(v).toFixed(1);
    o+=`<line x1="${L}" y1="${y}" x2="${w-R}" y2="${y}" stroke="var(--border)" opacity=".5"/><text x="${L-5}" y="${(+y+3).toFixed(1)}" class="chpt-date" fill="var(--txt2)" text-anchor="end">${opts.fmt(v)}</text>`;
  }
  let run=-1; // серые зоны «нет данных»
  for(let i=0;i<=n;i++){
    const isNull=i<n&&bs[i][key]===null;
    if(isNull&&run<0)run=i;
    if(!isNull&&run>=0){
      const x=L+slot*run,ww=slot*(i-run);
      o+=`<rect x="${x.toFixed(1)}" y="${T}" width="${ww.toFixed(1)}" height="${ph}" fill="var(--txt2)" opacity=".13"/>`;
      if(ww>90)o+=`<text x="${(x+ww/2).toFixed(1)}" y="${(T+ph/2).toFixed(1)}" class="chpt-date" fill="var(--txt2)" text-anchor="middle">нет данных</text>`;
      run=-1;
    }
  }
  if(type==='delta')o+=`<line x1="${L}" y1="${yOf(0).toFixed(1)}" x2="${w-R}" y2="${yOf(0).toFixed(1)}" class="chart-zeroline"/>`;
  (opts.hLines||[]).forEach((l,i)=>{ // пунктир: максимум / среднее
    const y=yOf(l.v);
    o+=`<line x1="${L}" y1="${y.toFixed(1)}" x2="${w-R}" y2="${y.toFixed(1)}" stroke="${l.col}" stroke-width="1.5" stroke-dasharray="6,4"/>`+
       `<text x="${w-R-2}" y="${(i===0?y-4:y+12).toFixed(1)}" class="chpt-val" fill="${l.col}" text-anchor="end">${l.label}</text>`;
  });
  if(type==='delta'){
    const bw=Math.max(1,slot*0.72),y0=yOf(0);
    bs.forEach((b,i)=>{
      if(b.delta===null)return;
      const y=yOf(b.delta);
      o+=`<rect x="${(xOf(i)-bw/2).toFixed(1)}" y="${Math.min(y,y0).toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(1,Math.abs(y-y0)).toFixed(1)}" fill="${b.delta>=0?'var(--grn)':'var(--red)'}"><title>${b.label}: ${opts.fmt(b.delta)}</title></rect>`;
    });
  }else{
    let path='',pen=false,lastI=-1;
    bs.forEach((b,i)=>{
      if(b.value===null){pen=false;return;}
      path+=(pen?'L':'M')+xOf(i).toFixed(1)+' '+yOf(b.value).toFixed(1)+' ';pen=true;lastI=i;
    });
    o+=`<path d="${path.trim()}" fill="none" stroke="var(--acc)" stroke-width="2" stroke-linejoin="round"/>`;
    bs.forEach((b,i)=>{
      if(b.value===null||(n>60&&i!==lastI))return; // на плотных графиках точка остаётся только у «сегодня»
      o+=`<circle cx="${xOf(i).toFixed(1)}" cy="${yOf(b.value).toFixed(1)}" r="${i===lastI?4:2.6}" fill="var(--acc)"><title>${b.label}: ${opts.fmt(b.value)}</title></circle>`;
    });
  }
  const k=Math.min(n,5); // подписи оси X (первая прижата влево, последняя — вправо)
  for(let j=0;j<k;j++){
    const i=k===1?0:Math.round(j*(n-1)/(k-1));
    const anchor=j===0?'start':(j===k-1?'end':'middle'),x=j===0?L:(j===k-1?w-R:xOf(i));
    o+=`<text x="${x.toFixed(1)}" y="${h-10}" class="chpt-date" fill="var(--txt2)" text-anchor="${anchor}">${bs[i].label}</text>`;
  }
  return o+'</svg>';
}
function renderFsChart(){
  const ov=document.getElementById('fsov');if(!ov)return;
  const box=ov.querySelector('#fsChart'),foot=ov.querySelector('#fsFoot');
  const mainId=S.settings.mainNodeId;
  if(!(mainId&&S.nodes[mainId])||getHistoryPoints().length<2){box.innerHTML='<div class="chart-empty">Пока недостаточно данных.</div>';foot.innerHTML='';return;}
  const {buckets,gran}=fsSeries(_fsScale);
  const st=historyStats(),C_MAX='#f59e0b',C_AVG='#22d3ee';
  const w=Math.max(260,box.clientWidth),h=Math.max(160,box.clientHeight);
  const gapNote=buckets.some(b=>b.value===null)?' Серая зона — данных за этот период ещё нет.':'';
  if(_fsType==='delta'){
    box.innerHTML=svgFitChart('delta',buckets,w,h,{fmt:fmtDelta,hLines:[
      {v:st.max,col:C_MAX,label:'макс '+fmtDelta(st.max)},{v:st.avg,col:C_AVG,label:'сред '+fmtDelta(st.avg)}]});
    foot.innerHTML=`<span style="color:${C_MAX}">╌╌ максимум за всё время: <b>${fmtDelta(st.max)}</b></span> &nbsp; <span style="color:${C_AVG}">╌╌ среднее за всё время: <b>${fmtDelta(st.avg)}</b></span><br>Точка — ${FS_GRAN_NAME[gran]} (средний прирост за день).${gapNote}`;
  }else{
    box.innerHTML=svgFitChart('score',buckets,w,h,{fmt:fsNum});
    const cur=nodeVal(mainId),lvl=levelForScore(cur),rem=Math.max(0,leagueThreshold(lvl+1)-cur);
    foot.innerHTML=`Сейчас <b style="color:var(--yel)">${Math.round(cur).toLocaleString('ru-RU')}</b> очков · до лиги ${leagueIcon(lvl+1)} ${leagueName(lvl+1)} осталось <b style="color:var(--yel)">${rem.toLocaleString('ru-RU')}</b><br>Точка — ${FS_GRAN_NAME[gran]}.${gapNote}`;
  }
}

    </div>

        <span style="color:${C_AVG}">╌╌ среднее за всё время: <b style="color:${C_AVG}">${fmtD(st.avg)}</b></span>

function scrollStatChartsToEnd(root){
  ['scChart','dChart'].forEach(id=>{ // промотаем графики к самым свежим (правым) точкам

}
// Если модалка статистики открыта — перерисовываем её содержимое (вызывается из persist()).
// Положение горизонтальной прокрутки сохраняем; если график был промотан до конца — остаёмся на краю.
function refreshStatsIfOpen(){
  renderFsChart(); // полноэкранный график (если открыт) тоже обновляется сразу
  const ov=document.querySelector('.ov[data-stats="1"]');if(!ov)return;
  const body=ov.querySelector('#statBody');if(!body)return;
  const keep={};
  ['scChart','dChart'].forEach(id=>{
    const el=body.querySelector('#'+id);
    if(el)keep[id]={x:el.scrollLeft,end:el.scrollLeft+el.clientWidth>=el.scrollWidth-4};
  });
  body.innerHTML=statsBodyHtml();
  ['scChart','dChart'].forEach(id=>{
    const el=body.querySelector('#'+id);
    if(el&&keep[id])el.scrollLeft=keep[id].end?el.scrollWidth:keep[id].x;
  });
}

// ══════════════════════════════════════════════════
//  v9 (часть 5): ВЕРСИЯ ПРИЛОЖЕНИЯ и обновление кода на устройстве
// ══════════════════════════════════════════════════
// APP_BUILD — версия этого HTML. ОБЯЗАНА совпадать с CACHE в sw.js (при каждой выкладке поднимать оба). Служебная сверка:
// SW после обновления сообщает открытым вкладкам имя своего кэша; если оно не равно APP_BUILD, вкладка работает на устаревшем коде
// и один раз перезагружается (reloadForUpdate). Индикатор «vX.Y» внизу экрана и в «❓ Инструкция» показывает версию кода и имя кэша
// офлайн-копии; жёлтый цвет и «⚠» — они расходятся (устройство ещё не доехало до новой версии: откройте приложение с интернетом).
const APP_BUILD='dtree-v8.5';
function verInfo(cb){ // cb(текст для подсказки, есть ли расхождение)
  const mine=APP_BUILD.replace('dtree-','');
  if(!window.caches){cb('Версия кода: '+mine+' (кэш недоступен)',false);return;}
  caches.keys().then(ks=>{
    const names=ks.filter(k=>k.indexOf('dtree-')===0);
    const warn=names.length>0&&names.some(k=>k!==APP_BUILD);
    cb('Версия кода: '+mine+'; кэш офлайн-копии: '+(names.map(k=>k.replace('dtree-','')).join(', ')||'нет'),warn);
  }).catch(()=>cb('Версия кода: '+mine,false));
}
function refreshVerBadge(){
  const el=document.getElementById('appver');if(!el)return;
  el.textContent=APP_BUILD.replace('dtree-','');
  verInfo((t,warn)=>{el.title=t;el.classList.toggle('warn',warn);if(warn)el.textContent=APP_BUILD.replace('dtree-','')+' ⚠';});
}
// Перезагрузка вкладки на новый код: максимум один раз на версию (защита от цикла), не во время ввода текста,
// сначала локальное сохранение; несохранённая отправка в облако не теряется (fbDirty лежит в localStorage).
function reloadForUpdate(ver){
  try{if(sessionStorage.getItem('dtree_swreload')===ver)return;sessionStorage.setItem('dtree_swreload',ver);}catch(e){}
  const a=document.activeElement;
  if(a&&(a.tagName==='INPUT'||a.tagName==='TEXTAREA'||a.isContentEditable)){try{sessionStorage.removeItem('dtree_swreload');}catch(e){}return;} // человек печатает — обновимся при следующем открытии
  persist(false).catch(()=>{}).then(()=>location.reload());
}

// ══════════════════════════════════════════════════
//  INIT
// ══════════════════════════════════════════════════
async function init(){
  try{idb=await openIDB();}catch(e){console.warn('IDB unavailable');}
  const saved=await restore();
  loadCam(saved&&saved.cam); // v9 (часть 5): камера — из локального ключа; старая камера из сохранения — только если ключа ещё нет
  if(saved){S=migrate(saved);}
  fbLoadMeta();      // v8: «есть неотправленные правки» и база слияния из прошлого сеанса
  _lastSig=sigOf(S); // v8: стартовое содержимое — не считается правкой пользователя
  if(!Object.keys(S.nodes).length){
    const i1=gid('n'),i2=gid('n'),i3=gid('n');
    S.nodes[i1]={id:i1,x:300,y:180,text:'Главная цель',type:'node',tableId:null,checkboxes:[]};
    S.nodes[i2]={id:i2,x:120,y:350,text:'Подзадача 1',type:'node',tableId:null,checkboxes:[]};
    S.nodes[i3]={id:i3,x:480,y:350,text:'Подзадача 2',type:'node',tableId:null,checkboxes:[]};
    S.conns.push({id:gid('c'),from:i1,to:i2});
    S.conns.push({id:gid('c'),from:i1,to:i3});
    S.settings.mainNodeId=i1; // для новых пользователей сразу отслеживаем «Главную цель»
  }
  dailyTick(); // догоняющая проверка: история очков / идеальные дни / события конкурентов за пропущенные дни
  renderAll();
  renderLeagueBar();
  persist(false); // v6/v8: сохраняем результат догоняющей проверки ЛОКАЛЬНО; в облако при старте не пишем (ждём первый снимок облака)
  setInterval(()=>persist(false),30000); // v8: таймер — только локальное сохранение, облако не трогает
  initFirebase();

  // Register Service Worker (PWA)
  refreshVerBadge();
  if('serviceWorker' in navigator){
    // v9 (часть 5): SW сообщает об активации новой версии; вкладка отвечает «я здесь» (иначе SW сам перезагрузит такую,
    // старую, вкладку) и перезагружается сама, если код устарел относительно SW.
    navigator.serviceWorker.addEventListener('message',e=>{
      const d=e.data;if(!d||d.type!=='sw-activated')return;
      try{if(e.ports&&e.ports[0])e.ports[0].postMessage({build:APP_BUILD});}catch(err){}
      refreshVerBadge();
      if(d.cache!==APP_BUILD)reloadForUpdate(d.cache);
    });
    // updateViaCache:'none' — sw.js проверяется на сервере, а не берётся из HTTP-кэша (иначе новая версия может «не замечаться» минутами)
    navigator.serviceWorker.register('sw.js',{updateViaCache:'none'})
      .then(r=>{
        console.log('SW registered',r.scope);
        // Установленное PWA часто не перезапускается, а лишь возвращается из фона — проверяем обновление при каждом возврате в приложение
        document.addEventListener('visibilitychange',()=>{if(!document.hidden)r.update().catch(()=>{});});
      })
      .catch(e=>console.log('SW unavailable (normal for local file):',e));
  }

  // Show hint for mobile
  if('ontouchstart' in window){
    const h=document.getElementById('lphint');
    h.style.opacity='1';setTimeout(()=>{h.style.opacity='0';},3500);
  }
}

init();
